services:
  db:
    image: postgres:15
    volumes:
      - ./postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=django_db
      - POSTGRES_USER=django_user
      - POSTGRES_PASSWORD=django_pass
      # Removed AI_SERVER_URL from here (Database doesn't need it)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U django_user -d django_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    environment:
      - DB_NAME=django_db
      - DB_USER=django_user
      - DB_PASSWORD=django_pass
      - DB_HOST=db
      - DB_PORT=5432
      # CRITICAL CHANGE: Use 'ai-server' instead of '127.0.0.1'
      - AI_SERVER_URL=http://26.217.98.105:8001/chat # http://26.217.98.105:8001/chat
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      # This maps the hostname 'ai-server' to the host machine's IP
      - "ai-server:26.217.98.105"
      #192.168.29.162
      #26.217.98.105