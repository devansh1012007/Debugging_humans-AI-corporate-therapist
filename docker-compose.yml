services:
  db:
    image: postgres:15
    volumes:
      - ./postgres_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=django_db
      - POSTGRES_USER=django_user
      - POSTGRES_PASSWORD=django_pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U django_user -d django_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/code
    ports:
      - "8000:8000"
    # We use a map (key: value) here so the anchor works
    environment: &django_env
      DB_NAME: django_db
      DB_USER: django_user
      DB_PASSWORD: django_pass
      DB_HOST: db
      DB_PORT: 5432
      AI_SERVER_URL: http://ai-server:8001/chat
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "ai-server:26.217.98.105"

  scheduler:
    build: .
    # Ensure 'runapscheduler' is your actual management command name
    command: python manage.py run_scheduler
    volumes:
      - .:/code
    environment:
      <<: *django_env
    depends_on:
      db:
        condition: service_healthy
    extra_hosts:
      - "ai-server:26.217.98.105"