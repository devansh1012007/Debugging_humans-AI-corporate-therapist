version: '3.8'

services:
  jekyll:
    image: jekyll/jekyll:latest
    command: jekyll serve --watch --force_polling --livereload
    ports:
      - "4000:4000"
      - "35729:35729" # Port for LiveReload
    volumes:
      - .:/srv/jekyll
      - vendor-bundle:/usr/local/bundle
    environment:
      - JEKYLL_ENV=development

volumes:
  vendor-bundle:
