<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Psychologist Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#0f172a] text-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        // --- React Imports Destructuring ---
        const { useState, useEffect, useCallback, useRef, createContext } = React;

        // --- GOOGLE CLIENT ID ---
        // TODO: REPLACE THIS WITH YOUR ACTUAL GOOGLE CLIENT ID
        const GOOGLE_CLIENT_ID = "931160189506-i9p1l3lgf20oqn3ffr0paujnvc2bn6vu.apps.googleusercontent.com";

        // --- Icons (Lucide replacement) ---
        const IconWrapper = ({ children, size = 24, className = "", ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>
                {children}
            </svg>
        );

        // Minified Icons for brevity
        const Icons = {
            Bot: (p) => <IconWrapper {...p}><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></IconWrapper>,
            User: (p) => <IconWrapper {...p}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></IconWrapper>,
            Lock: (p) => <IconWrapper {...p}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></IconWrapper>,
            Brain: (p) => <IconWrapper {...p}><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5 2.5 2.5 0 0 1 14.5 2a2.5 2.5 0 0 1 2.5 2.5V7h-5V4.5A2.5 2.5 0 0 1 9.5 2z"/><path d="M12 7v4"/><path d="M12 11a4 4 0 0 0-4 4v3a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-3a4 4 0 0 0-4-4z"/></IconWrapper>,
            Send: (p) => <IconWrapper {...p}><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></IconWrapper>,
            Menu: (p) => <IconWrapper {...p}><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="18" x2="20" y2="18"/></IconWrapper>,
            X: (p) => <IconWrapper {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></IconWrapper>,
            LayoutDashboard: (p) => <IconWrapper {...p}><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></IconWrapper>,
            MessageSquare: (p) => <IconWrapper {...p}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></IconWrapper>,
            LogOut: (p) => <IconWrapper {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></IconWrapper>,
            Chrome: (p) => <IconWrapper {...p}><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><line x1="21.17" y1="8" x2="12" y2="8"/><line x1="3.95" y1="6.06" x2="8.54" y2="14"/><line x1="10.88" y1="21.94" x2="15.46" y2="14"/></IconWrapper>
        };

        // --- Configuration ---
        const API_BASE = 'http://localhost:8000'; 

        // --- API Client ---
        class ApiClient {
            constructor() {
                this.accessToken = localStorage.getItem('access_token');
                this.refreshToken = localStorage.getItem('refresh_token');
            }
            
            setTokens(access, refresh) {
                this.accessToken = access;
                this.refreshToken = refresh;
                localStorage.setItem('access_token', access);
                localStorage.setItem('refresh_token', refresh);
            }
            
            clearTokens() {
                this.accessToken = null;
                this.refreshToken = null;
                localStorage.removeItem('access_token');
                localStorage.removeItem('refresh_token');
            }
            
            async request(endpoint, options = {}) {
                let url = endpoint.startsWith('http') ? endpoint : `${API_BASE}${endpoint}`;
                const headers = { 'Content-Type': 'application/json', ...options.headers };
                if (this.accessToken) headers['Authorization'] = `Bearer ${this.accessToken}`;
                
                const config = { ...options, headers };
                
                try {
                    let response = await fetch(url, config);
                    if (response.status === 401 && this.refreshToken) {
                        const refreshSuccess = await this.refreshAccessToken();
                        if (refreshSuccess) {
                            config.headers['Authorization'] = `Bearer ${this.accessToken}`;
                            response = await fetch(url, config);
                        } else {
                            this.clearTokens();
                            window.location.reload(); 
                            throw new Error('Session expired');
                        }
                    }
                    if (!response.ok) {
                        const errorData = await response.json().catch(() => ({}));
                        throw new Error(errorData.detail || errorData.error || `Error: ${response.status}`);
                    }
                    return await response.json();
                } catch (error) { throw error; }
            }
            
            async refreshAccessToken() {
                try {
                    const response = await fetch(`${API_BASE}/refresh/`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ refresh: this.refreshToken }),
                    });
                    if (response.ok) {
                        const data = await response.json();
                        this.setTokens(data.access, this.refreshToken); 
                        return true;
                    }
                    return false;
                } catch (e) { return false; }
            }
        }
        
        const api = new ApiClient();

        // --- Auth Components ---
        const Login = ({ onLogin, onSwitchToRegister }) => {
            const [username, setUsername] = useState('');
            const [password, setPassword] = useState('');
            const [error, setError] = useState('');
            const [loading, setLoading] = useState(false);
            const [consentChecked, setConsentChecked] = useState(false);

            // Handle Standard JWT Login
            const handleSubmit = async (e) => {
                e.preventDefault();
                if (!consentChecked) { setError('Please acknowledge the wellness support consent.'); return; }
                setLoading(true);
                setError('');
                try {
                    const data = await api.request('/login/', { 
                        method: 'POST',
                        body: JSON.stringify({ username, password }),
                    });
                    if (data.access && data.refresh) {
                        api.setTokens(data.access, data.refresh);
                        onLogin();
                    } else { throw new Error("Invalid response from server"); }
                } catch (err) { setError('Invalid credentials or server error'); } finally { setLoading(false); }
            };

            // Handle Google Login
            const handleGoogleLogin = () => {
                if (!consentChecked) { setError('Please acknowledge the wellness support consent first.'); return; }
                
                // Initialize the Code Client (Backend expects 'code', not 'token')
                const client = google.accounts.oauth2.initCodeClient({
                    client_id: GOOGLE_CLIENT_ID,
                    scope: 'email profile',
                    ux_mode: 'popup',
                    callback: async (response) => {
                        if (response.code) {
                            setLoading(true);
                            try {
                                // Send the code to Django backend
                                const res = await fetch(`${API_BASE}/google/`, {
                                    method: 'POST',
                                    headers: { 'Content-Type': 'application/json' },
                                    body: JSON.stringify({ 
                                        code: response.code 
                                    })
                                });

                                if (!res.ok) {
                                    const errData = await res.json();
                                    throw new Error(errData.non_field_errors || "Google Login Failed");
                                }

                                const data = await res.json();
                                // IMPORTANT: backend returns { access: "...", refresh: "..." }
                                // or { key: "..." } depending on dj-rest-auth config. 
                                // Your config suggests SimpleJWT is used, so access/refresh.
                                
                                if (data.access && data.refresh) {
                                    api.setTokens(data.access, data.refresh);
                                    onLogin();
                                } else if (data.key) {
                                    // Fallback for TokenAuth if JWT not configured strictly
                                    api.setTokens(data.key, null); // Only access
                                    onLogin();
                                } else {
                                    throw new Error("No tokens received from Google Login");
                                }

                            } catch (err) {
                                console.error("Google Auth Backend Error:", err);
                                setError(`Google Login Failed: ${err.message}`);
                            } finally {
                                setLoading(false);
                            }
                        }
                    },
                });
                client.requestCode();
            };

            return (
                <div className="min-h-screen flex items-center justify-center bg-[#0f172a] px-4">
                    <div className="max-w-md w-full space-y-8 p-10 bg-[#1e293b] rounded-2xl shadow-2xl border border-slate-700">
                        <div className="text-center">
                            <div className="mx-auto h-16 w-16 bg-indigo-500 rounded-2xl flex items-center justify-center mb-6 shadow-lg shadow-indigo-500/20 transform -rotate-3">
                                <Icons.Brain className="text-white h-8 w-8" />
                            </div>
                            <h2 className="text-3xl font-bold text-slate-100 tracking-tight">AI Psychologist</h2>
                            <p className="mt-2 text-sm text-slate-400">Your personal wellness dashboard</p>
                        </div>

                        {error && <div className="p-3 rounded-lg bg-red-900/20 text-red-400 text-sm text-center font-medium border border-red-900/30">{error}</div>}

                        <form className="mt-8 space-y-6" onSubmit={handleSubmit}>
                            <div className="space-y-4">
                                <div className="relative group">
                                    <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                        <Icons.User className="h-5 w-5 text-slate-500 group-focus-within:text-indigo-400 transition-colors" />
                                    </div>
                                    <input type="text" required className="block w-full pl-11 pr-4 py-3 border border-slate-700 rounded-xl bg-slate-800/50 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all sm:text-sm" placeholder="Username" value={username} onChange={(e) => setUsername(e.target.value)} />
                                </div>
                                <div className="relative group">
                                    <div className="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                        <Icons.Lock className="h-5 w-5 text-slate-500 group-focus-within:text-indigo-400 transition-colors" />
                                    </div>
                                    <input type="password" required className="block w-full pl-11 pr-4 py-3 border border-slate-700 rounded-xl bg-slate-800/50 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition-all sm:text-sm" placeholder="Password" value={password} onChange={(e) => setPassword(e.target.value)} />
                                </div>
                            </div>

                             <div className="bg-slate-800/50 p-4 rounded-xl border border-slate-700/50">
                                <div className="flex items-center gap-3">
                                    <input type="checkbox" id="wellness-consent" className="h-4 w-4 text-indigo-500 focus:ring-indigo-500 border-slate-600 rounded bg-slate-700 cursor-pointer" checked={consentChecked} onChange={(e) => setConsentChecked(e.target.checked)} />
                                    <label htmlFor="wellness-consent" className="font-medium cursor-pointer select-none text-xs text-slate-300">I agree that this is a non-clinical support tool.</label>
                                </div>
                            </div>

                            <button type="submit" disabled={loading} className="w-full flex justify-center py-3.5 px-4 border border-transparent text-sm font-bold rounded-xl text-white bg-indigo-600 hover:bg-indigo-500 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 shadow-lg shadow-indigo-500/20 transform transition hover:-translate-y-0.5 disabled:opacity-50">
                                {loading ? 'Processing...' : 'Sign In with Password'}
                            </button>
                        </form>

                        <div className="relative">
                            <div className="absolute inset-0 flex items-center">
                                <div className="w-full border-t border-slate-700"></div>
                            </div>
                            <div className="relative flex justify-center text-sm">
                                <span className="px-2 bg-[#1e293b] text-slate-500">Or continue with</span>
                            </div>
                        </div>

                        <button 
                            type="button" 
                            onClick={handleGoogleLogin}
                            disabled={loading}
                            className="w-full flex items-center justify-center gap-3 py-3.5 px-4 border border-slate-600 text-sm font-bold rounded-xl text-slate-200 bg-slate-800 hover:bg-slate-700 focus:outline-none transition-all"
                        >
                            <Icons.Chrome className="h-5 w-5 text-white" />
                            Sign in with Google
                        </button>

                        <div className="text-center mt-4">
                            <button type="button" onClick={onSwitchToRegister} className="text-sm font-medium text-indigo-400 hover:text-indigo-300 transition-colors">Create a new account</button>
                        </div>
                    </div>
                </div>
            );
        };

        const Dashboard = ({ onLogout }) => (
            <div className="h-screen flex items-center justify-center flex-col">
                <h1 className="text-3xl text-white mb-4">Welcome to the Dashboard</h1>
                <p className="text-slate-400 mb-8">You are successfully logged in (JWT or Google).</p>
                <button onClick={onLogout} className="px-6 py-2 bg-red-600 rounded-lg text-white hover:bg-red-700">Logout</button>
            </div>
        );

        // --- Main App ---
        const App = () => {
            const [isAuthenticated, setIsAuthenticated] = useState(false);
            
            useEffect(() => {
                if (localStorage.getItem('access_token')) { setIsAuthenticated(true); }
            }, []);

            const handleLogin = () => setIsAuthenticated(true);
            const handleLogout = () => { api.clearTokens(); setIsAuthenticated(false); };

            return (
                <React.Fragment>
                    <style>{`body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f1f5f9; }`}</style>
                    {isAuthenticated ? <Dashboard onLogout={handleLogout} /> : <Login onLogin={handleLogin} onSwitchToRegister={() => alert("Registration View Placeholder")} />}
                </React.Fragment>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
