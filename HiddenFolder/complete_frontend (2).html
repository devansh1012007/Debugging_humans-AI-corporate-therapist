<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Psychologist Dashboard</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="bg-[#0f172a] text-slate-100">
    <div id="root"></div>

    <script>
        // --- Configuration ---
        const API_BASE = 'http://localhost:8000/'; 
        const CURRENT_CONSENT_VERSION = 'v1.0-2026';

        // --- Utility: API Client ---
        class ApiClient {
          constructor() {
            if (typeof window !== 'undefined') {
              this.accessToken = localStorage.getItem('access_token');
              this.refreshToken = localStorage.getItem('refresh_token');
            } else {
              this.accessToken = null;
              this.refreshToken = null;
            }
          }
        
          setTokens(access, refresh) {
            this.accessToken = access;
            this.refreshToken = refresh;
            localStorage.setItem('access_token', access);
            localStorage.setItem('refresh_token', refresh);
          }
        
          clearTokens() {
            this.accessToken = null;
            this.refreshToken = null;
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
          }
        
          async request(endpoint, options = {}) {
            let url = endpoint.startsWith('http') ? endpoint : `${API_BASE}${endpoint}`;
            const headers = { 'Content-Type': 'application/json', ...options.headers };
            if (this.accessToken) headers['Authorization'] = `Bearer ${this.accessToken}`;
        
            const config = { ...options, headers };
            
            console.log(`🌐 API Request: ${options.method || 'GET'} ${url}`);
        
            try {
              let response = await fetch(url, config);
              console.log(`📡 Response status: ${response.status}`);
              
              if (response.status === 401 && this.refreshToken) {
                console.log('🔄 Token expired, refreshing...');
                const refreshSuccess = await this.refreshAccessToken();
                if (refreshSuccess) {
                  config.headers['Authorization'] = `Bearer ${this.accessToken}`;
                  response = await fetch(url, config);
                  console.log(`📡 Retry response status: ${response.status}`);
                } else {
                  console.error('❌ Token refresh failed');
                  this.clearTokens();
                  window.location.reload(); 
                  throw new Error('Session expired');
                }
              }
              if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                console.error('❌ API Error:', errorData);
                throw new Error(errorData.detail || errorData.error || `Error: ${response.status}`);
              }
              const data = await response.json();
              console.log('✅ Response data:', data);
              return data;
            } catch (error) { 
              console.error('❌ Request failed:', error);
              throw error; 
            }
          }
        
          async refreshAccessToken() {
            try {
              const response = await fetch(`${API_BASE}/refresh/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ refresh: this.refreshToken }),
              });
              if (response.ok) {
                const data = await response.json();
                this.setTokens(data.access, this.refreshToken); 
                return true;
              }
              return false;
            } catch (e) { return false; }
          }

          // Check if consent is needed
          needsConsent() {
            const consentVersion = this.getCookie('consent_version_held');
            return !consentVersion || consentVersion !== CURRENT_CONSENT_VERSION;
          }

          getCookie(name) {
            const value = `; ${document.cookie}`;
            const parts = value.split(`; ${name}=`);
            if (parts.length === 2) return parts.pop().split(';').shift();
            return null;
          }
        }
        
        const api = new ApiClient();

        // --- SVG Icons ---
        function Icon({ name, size = 20, className = "" }) {
            const icons = {
                messageSquare: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>',

                brain: '<path d="M9.5 2A2.5 2.5 0 0 1 12 4.5 2.5 2.5 0 0 1 14.5 2a2.5 2.5 0 0 1 2.5 2.5V7h-5V4.5A2.5 2.5 0 0 1 9.5 2z"/><path d="M12 7v4"/><path d="M12 11a4 4 0 0 0-4 4v3a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-3a4 4 0 0 0-4-4z"/>',
                send: '<line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/>',
                plus: '<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',

                x: '<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
                dashboard: '<rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/>',
                chevronRight: '<polyline points="9 18 15 12 9 6"/>',
                chevronDown: '<polyline points="6 9 12 15 18 9"/>',

                thumbsUp: '<path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/>',

                alertCircle: '<circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>',
                stethoscope: '<path d="M4.8 2.3A.3.3 0 0 1 5 2h14a.3.3 0 0 1 .2.3v3.4a3 3 0 0 1-3 3H7.8a3 3 0 0 1-3-3V2.3Z"/><path d="M12 17v-8.3"/><path d="M8 17h8"/><path d="M12 17a4 4 0 0 1-4 4H5"/>',
                heartHandshake: '<path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>',
                activity: '<polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/>',
                barChart: '<line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/>',
                lightbulb: '<path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-1 1.5-2.5 1.5-4.1 0-3.2-2.8-5.7-6-5.7-3.2 0-6 2.5-6 5.7 0 1.6.5 3.1 1.5 4.1.8.8 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/>'
            };
            
            const path = icons[name] || '';
            return `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="${className}">${path}</svg>`;
        }

        // --- Component: Consent Modal ---
        function ConsentModal({ onConsent }) {
            return `

                    <div class="bg-[#1e293b] rounded-2xl p-8 w-full max-w-2xl shadow-2xl border border-slate-700 relative">
                        <div class="mb-6">
                            <h2 class="text-2xl font-bold text-white mb-2">Privacy & Consent</h2>
                            <p class="text-slate-400 text-sm">Please read and accept our privacy policy to continue</p>
                        </div>
                        
                        <div class="bg-slate-800/50 rounded-xl p-6 mb-6 max-h-64 overflow-y-auto border border-slate-700">
                            <h3 class="text-lg font-semibold text-white mb-3">Data Collection Notice</h3>
                            <div class="text-sm text-slate-300 space-y-3">

                                <ul class="list-disc list-inside space-y-1 text-slate-400">
                                    <li>Your IP address and user agent for security purposes</li>
                                    <li>Chat conversations for mental health analysis</li>
                                    <li>Dashboard and wellness data</li>

                                <p>This data is used solely to provide you with personalized mental health support and improve our services.</p>
                                <p class="text-xs text-slate-500 mt-4">Consent Version: ${CURRENT_CONSENT_VERSION}</p>
                            </div>
                        </div>

                        <div class="flex gap-4">

                                I Accept

                    </div>

        }

        // --- Component: Login ---

                                ${Icon({ name: 'brain', size: 32, className: 'text-white' })}
                            </div>

                        </div>
                        <form class="mt-8 space-y-6" onsubmit="handleLogin(event)">
                            <div class="space-y-4">
                                <div class="relative">
                                    <input type="text" id="username" required class="block w-full pl-11 pr-4 py-3 border border-slate-700 rounded-xl bg-slate-800/50 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Username" />
                                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                                        ${Icon({ name: 'user', size: 20, className: 'text-slate-500' })}
                                    </div>
                                </div>
                                <div class="relative">
                                    <input type="password" id="password" required class="block w-full pl-11 pr-4 py-3 border border-slate-700 rounded-xl bg-slate-800/50 text-slate-200 placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Password" />
                                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">

                                </div>
                            </div>
                            <div class="flex items-center justify-end">
                                <button type="button" onclick="switchToRegister()" class="text-sm font-medium text-indigo-400 hover:text-indigo-300">Create an account</button>
                            </div>
                            <div id="login-error" class="hidden p-3 rounded-lg bg-red-900/20 text-red-400 text-sm text-center font-medium border border-red-900/30"></div>
                            <button type="submit" class="w-full flex justify-center py-3.5 px-4 text-sm font-bold rounded-xl text-white bg-indigo-600 hover:bg-indigo-500 shadow-lg">

                            </button>
                        </form>

            `;
        }

        // --- Component: Register ---
        function Register() {
            return `

                    <div class="max-w-md w-full space-y-8 p-10 bg-[#1e293b] rounded-2xl shadow-2xl border border-slate-700">
                        <div class="text-center">
                            <h2 class="text-3xl font-bold text-slate-100">Create Account</h2>
                        </div>
                        <form class="mt-8 space-y-6" onsubmit="handleRegister(event)">
                            <div class="space-y-4">
                                <input type="text" id="reg-username" required class="block w-full px-4 py-3 border border-slate-700 rounded-xl bg-slate-800/50 text-slate-200 focus:ring-indigo-500 focus:outline-none" placeholder="Username" />
                                <input type="email" id="reg-email" required class="block w-full px-4 py-3 border border-slate-700 rounded-xl bg-slate-800/50 text-slate-200 focus:ring-indigo-500 focus:outline-none" placeholder="Email" />
                                <input type="password" id="reg-password" required class="block w-full px-4 py-3 border border-slate-700 rounded-xl bg-slate-800/50 text-slate-200 focus:ring-indigo-500 focus:outline-none" placeholder="Password" />

                            <div id="register-error" class="hidden text-red-400 text-sm text-center"></div>

                            </div>
                        </form>
                    </div>
                </div>
            `;
        }

        // --- Component: Dashboard ---
        function Dashboard({ dashboardData }) {
            if (!dashboardData || !dashboardData.content || dashboardData.content.length === 0) {
                return `
                    <div class="max-w-6xl mx-auto">
                        <div class="bg-[#1e293b]/20 border border-slate-800 rounded-3xl p-12 text-center">
                            ${Icon({ name: 'activity', size: 48, className: 'mx-auto text-slate-600 mb-4' })}
                            <h2 class="text-2xl font-bold text-slate-300 mb-2">No Dashboard Data Available</h2>
                            <p class="text-slate-500">Your personal wellness data will appear here once available.</p>
                        </div>
                    </div>
                `;
            }

            const data = dashboardData.content[0] || {};
            const problems = data.problems || [];
            const positives = data.positives || [];
            const recommendations = data.recommendations || [];

            return `
                <div class="max-w-6xl mx-auto space-y-8">
                    <div class="bg-gradient-to-br from-indigo-500/10 to-purple-500/10 border border-indigo-500/20 rounded-3xl p-8">
                        <h1 class="text-3xl font-bold text-white mb-2">Personal Wellness Dashboard</h1>
                        <p class="text-slate-400">Your mental health insights and recommendations</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <!-- Problems -->
                        <div class="bg-[#1e293b] border border-slate-700 rounded-2xl p-6">
                            <div class="flex items-center gap-3 mb-4">
                                ${Icon({ name: 'alertCircle', size: 20, className: 'text-red-400' })}
                                <h3 class="text-lg font-bold text-white">Areas to Address</h3>
                            </div>
                            <div class="space-y-3">
                                ${problems.length > 0 ? problems.map(p => `
                                    <div class="bg-slate-800/50 p-4 rounded-xl">
                                        <h4 class="text-sm font-semibold text-red-300 mb-1">${p.problem || 'N/A'}</h4>
                                        <p class="text-xs text-slate-400">${p.suggestion || ''}</p>
                                    </div>
                                `).join('') : '<p class="text-slate-500 text-sm">No problems identified</p>'}
                            </div>
                        </div>

                        <!-- Recommendations -->
                        <div class="bg-[#1e293b] border border-slate-700 rounded-2xl p-6">
                            <div class="flex items-center gap-3 mb-4">
                                ${Icon({ name: 'lightbulb', size: 20, className: 'text-yellow-400' })}
                                <h3 class="text-lg font-bold text-white">Recommendations</h3>
                            </div>
                            <div class="space-y-3">
                                ${recommendations.length > 0 ? recommendations.map(r => `
                                    <div class="bg-slate-800/50 p-4 rounded-xl">
                                        <p class="text-sm text-slate-300">${r.recommendation || r}</p>
                                    </div>
                                `).join('') : '<p class="text-slate-500 text-sm">No recommendations</p>'}
                            </div>
                        </div>

                        <!-- Positives -->
                        <div class="bg-[#1e293b] border border-slate-700 rounded-2xl p-6">
                            <div class="flex items-center gap-3 mb-4">
                                ${Icon({ name: 'thumbsUp', size: 20, className: 'text-green-400' })}
                                <h3 class="text-lg font-bold text-white">Strengths</h3>
                            </div>
                            <div class="space-y-3">
                                ${positives.length > 0 ? positives.map(p => `
                                    <div class="bg-slate-800/50 p-4 rounded-xl">
                                        <p class="text-sm text-slate-300">${p.positive || p}</p>
                                    </div>
                                `).join('') : '<p class="text-slate-500 text-sm">No positives identified</p>'}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- Component: Team Dashboard ---
        function TeamDashboard({ teamData, drillDownList }) {
            if (!teamData || !teamData.content || teamData.content.length === 0) {
                return `
                    <div class="max-w-6xl mx-auto">
                        <div class="bg-[#1e293b]/20 border border-slate-800 rounded-3xl p-12 text-center">
                            ${Icon({ name: 'users', size: 48, className: 'mx-auto text-slate-600 mb-4' })}
                            <h2 class="text-2xl font-bold text-slate-300 mb-2">No Team Data Available</h2>
                            <p class="text-slate-500">Team wellness data will appear here once available.</p>
                        </div>
                    </div>
                `;
            }

            const data = teamData.content[0] || {};
            const problems = data.problems || [];
            const recommendations = data.recommendations || [];
            const policyChanges = data.policy_changes || [];
            
            // Get subordinates from drill down list (exclude first item which is the user)
            const subordinates = drillDownList.slice(1);

            return `
                <div class="max-w-6xl mx-auto space-y-8">
                    <div class="bg-gradient-to-br from-purple-500/10 to-pink-500/10 border border-purple-500/20 rounded-3xl p-8">

                        <p class="text-slate-400">Mental health insights for your team</p>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <!-- Problems -->
                        <div class="bg-[#1e293b] border border-slate-700 rounded-2xl p-6">
                            <div class="flex items-center gap-3 mb-4">
                                ${Icon({ name: 'alertCircle', size: 20, className: 'text-red-400' })}
                                <h3 class="text-lg font-bold text-white">Team Issues</h3>
                            </div>
                            <div class="space-y-3">
                                ${problems.length > 0 ? problems.map(p => `
                                    <div class="bg-slate-800/50 p-4 rounded-xl">
                                        <h4 class="text-sm font-semibold text-red-300 mb-1">${p.problem || 'N/A'}</h4>
                                        <p class="text-xs text-slate-400">${p.suggestion || ''}</p>
                                    </div>
                                `).join('') : '<p class="text-slate-500 text-sm">No issues identified</p>'}
                            </div>
                        </div>

                        <!-- Recommendations -->
                        <div class="bg-[#1e293b] border border-slate-700 rounded-2xl p-6">
                            <div class="flex items-center gap-3 mb-4">
                                ${Icon({ name: 'lightbulb', size: 20, className: 'text-yellow-400' })}
                                <h3 class="text-lg font-bold text-white">Recommendations</h3>
                            </div>
                            <div class="space-y-3">
                                ${recommendations.length > 0 ? recommendations.map(r => `
                                    <div class="bg-slate-800/50 p-4 rounded-xl">
                                        <p class="text-sm text-slate-300">${r.recommendation || r}</p>
                                    </div>
                                `).join('') : '<p class="text-slate-500 text-sm">No recommendations</p>'}
                            </div>
                        </div>

                        <!-- Policy Changes -->
                        <div class="bg-[#1e293b] border border-slate-700 rounded-2xl p-6">
                            <div class="flex items-center gap-3 mb-4">
                                ${Icon({ name: 'activity', size: 20, className: 'text-blue-400' })}
                                <h3 class="text-lg font-bold text-white">Policy Changes</h3>
                            </div>
                            <div class="space-y-3">
                                ${policyChanges.length > 0 ? policyChanges.map(pc => `
                                    <div class="bg-slate-800/50 p-4 rounded-xl">
                                        <p class="text-sm text-slate-300">${pc.change || pc}</p>
                                    </div>
                                `).join('') : '<p class="text-slate-500 text-sm">No policy changes</p>'}
                            </div>
                        </div>
                    </div>

                    <!-- Team Members List -->
                    <div class="bg-[#1e293b] border border-slate-700 rounded-2xl p-6">
                        <h3 class="text-lg font-bold text-white mb-4">Team Members</h3>
                        <div class="space-y-2">
                            ${subordinates.length > 0 ? subordinates.map(member => `
                                <button onclick="viewSubordinateData('${member.node_id}')" class="w-full bg-slate-800/50 hover:bg-slate-800 p-4 rounded-xl flex items-center justify-between transition-colors">
                                    <div class="flex items-center gap-4">
                                        <div class="w-10 h-10 bg-indigo-500/20 rounded-full flex items-center justify-center">
                                            ${Icon({ name: 'user', size: 20, className: 'text-indigo-400' })}
                                        </div>
                                        <div class="text-left">
                                            <h4 class="text-sm font-semibold text-white">${member.name}</h4>
                                            <p class="text-xs text-slate-400">${member.title}</p>
                                            ${member.has_team ? '<span class="inline-block mt-1 px-2 py-0.5 bg-purple-500/20 text-purple-300 text-xs rounded-full">Has Team</span>' : ''}
                                        </div>
                                    </div>
                                    ${Icon({ name: 'chevronRight', size: 20, className: 'text-slate-600' })}
                                </button>
                            `).join('') : '<p class="text-slate-500 text-sm">No team members</p>'}
                        </div>
                    </div>
                </div>
            `;
        }

        // --- Component: Subordinate Dashboard ---
        function SubordinateDashboard({ subordinateData, memberInfo }) {
            if (!subordinateData || !subordinateData.content || subordinateData.content.length === 0) {
                return `
                    <div class="max-w-6xl mx-auto">
                        <button onclick="goToTeamDashboard()" class="mb-4 px-4 py-2 bg-slate-800 text-slate-300 rounded-lg hover:bg-slate-700 transition-colors">
                            ← Back to Team
                        </button>
                        <div class="bg-[#1e293b]/20 border border-slate-800 rounded-3xl p-12 text-center">
                            ${Icon({ name: 'lock', size: 48, className: 'mx-auto text-slate-600 mb-4' })}
                            <h2 class="text-2xl font-bold text-slate-300 mb-2">Data Not Available</h2>
                            <p class="text-slate-500">You cannot see this subordinate's data due to privacy reasons.</p>
                        </div>
                    </div>
                `;
            }

            const data = subordinateData.content[0] || {};
            const problems = data.problems || [];
            const recommendations = data.recommendations || [];
            const policyChanges = data.policy_changes || [];

            return `
                <div class="max-w-6xl mx-auto space-y-8">
                    <button onclick="goToTeamDashboard()" class="px-4 py-2 bg-slate-800 text-slate-300 rounded-lg hover:bg-slate-700 transition-colors">
                        ← Back to Team
                    </button>

                    <div class="bg-gradient-to-br from-cyan-500/10 to-blue-500/10 border border-cyan-500/20 rounded-3xl p-8">
                        <h1 class="text-3xl font-bold text-white mb-2">${memberInfo?.name || 'Team Member'}'s Dashboard</h1>
                        <p class="text-slate-400">${memberInfo?.title || 'Team Member'}</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                        <!-- Problems -->
                        <div class="bg-[#1e293b] border border-slate-700 rounded-2xl p-6">
                            <div class="flex items-center gap-3 mb-4">
                                ${Icon({ name: 'alertCircle', size: 20, className: 'text-red-400' })}
                                <h3 class="text-lg font-bold text-white">Issues</h3>
                            </div>
                            <div class="space-y-3">
                                ${problems.length > 0 ? problems.map(p => `
                                    <div class="bg-slate-800/50 p-4 rounded-xl">
                                        <h4 class="text-sm font-semibold text-red-300 mb-1">${p.problem || 'N/A'}</h4>
                                        <p class="text-xs text-slate-400">${p.suggestion || ''}</p>
                                    </div>
                                `).join('') : '<p class="text-slate-500 text-sm">No issues identified</p>'}
                            </div>
                        </div>

                        <!-- Recommendations -->
                        <div class="bg-[#1e293b] border border-slate-700 rounded-2xl p-6">
                            <div class="flex items-center gap-3 mb-4">
                                ${Icon({ name: 'lightbulb', size: 20, className: 'text-yellow-400' })}
                                <h3 class="text-lg font-bold text-white">Recommendations</h3>
                            </div>
                            <div class="space-y-3">
                                ${recommendations.length > 0 ? recommendations.map(r => `
                                    <div class="bg-slate-800/50 p-4 rounded-xl">
                                        <p class="text-sm text-slate-300">${r.recommendation || r}</p>
                                    </div>
                                `).join('') : '<p class="text-slate-500 text-sm">No recommendations</p>'}
                            </div>
                        </div>

                        <!-- Policy Changes -->
                        <div class="bg-[#1e293b] border border-slate-700 rounded-2xl p-6">
                            <div class="flex items-center gap-3 mb-4">
                                ${Icon({ name: 'activity', size: 20, className: 'text-blue-400' })}
                                <h3 class="text-lg font-bold text-white">Policy Changes</h3>
                            </div>
                            <div class="space-y-3">
                                ${policyChanges.length > 0 ? policyChanges.map(pc => `
                                    <div class="bg-slate-800/50 p-4 rounded-xl">
                                        <p class="text-sm text-slate-300">${pc.change || pc}</p>
                                    </div>
                                `).join('') : '<p class="text-slate-500 text-sm">No policy changes</p>'}
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // --- Component: Chat Interface ---
        function ChatInterface({ messages, activeSessionId }) {
            return `
                <div class="max-w-4xl mx-auto h-full flex flex-col">
                    <div id="chat-messages" class="flex-1 overflow-y-auto space-y-4 p-4 bg-[#1e293b]/20 rounded-2xl border border-slate-800">
                        ${messages.length === 0 ? `
                            <div class="text-center text-slate-500 py-20">
                                ${Icon({ name: 'messageSquare', size: 48, className: 'mx-auto mb-4' })}
                                <p>Start a conversation with your AI companion</p>
                            </div>
                        ` : messages.map(msg => `
                            <div class="${msg.role === 'user' ? 'flex justify-end' : 'flex justify-start'}">
                                <div class="${msg.role === 'user' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-200'} rounded-2xl px-4 py-3 max-w-2xl">
                                    <p class="text-sm whitespace-pre-wrap">${msg.content}</p>
                                </div>
                            </div>
                        `).join('')}
                        <div id="streaming-message"></div>
                    </div>

                    <form onsubmit="handleSendMessage(event)" class="mt-4 flex gap-2">
                        <input type="text" id="chat-input" placeholder="Type your message..." class="flex-1 px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                        <button type="submit" class="px-6 py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl transition-colors">
                            ${Icon({ name: 'send', size: 20, className: 'text-white' })}
                        </button>
                    </form>
                </div>
            `;
        }

        // --- Component: Feedback Form ---
        function FeedbackForm() {
            return `
                <div class="max-w-2xl mx-auto">
                    <div class="bg-[#1e293b] rounded-2xl p-8 border border-slate-700">
                        <h2 class="text-2xl font-bold text-white mb-6">Send Feedback</h2>
                        <form onsubmit="handleFeedbackSubmit(event)" class="space-y-6">
                            <div>
                                <label class="block text-sm font-medium text-slate-300 mb-2">Your Feedback</label>
                                <textarea id="feedback-text" rows="6" required class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Share your thoughts..."></textarea>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-slate-300 mb-2">Rating</label>
                                <select id="feedback-rating" class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                    <option value="5">5 - Excellent</option>
                                    <option value="4">4 - Good</option>
                                    <option value="3">3 - Average</option>
                                    <option value="2">2 - Poor</option>
                                    <option value="1">1 - Very Poor</option>
                                </select>
                            </div>
                            <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-500 rounded-xl text-white font-bold transition-colors">
                                Submit Feedback
                            </button>
                        </form>
                        <div id="feedback-success" class="hidden mt-4 p-3 bg-green-900/20 text-green-400 rounded-lg text-center"></div>
                    </div>
                </div>
            `;
        }

        // --- Global State ---
        let state = {
            isAuthenticated: false,
            currentView: 'login',
            showConsent: false,
            sessions: [],
            activeSessionId: null,
            messages: [],
            drillDownList: [],
            hasTeam: false,
            dashboardData: null,
            teamData: null,
            subordinateData: null,
            currentSubordinateInfo: null,
            sidebarCollapsed: true,
            newChatModalOpen: false
        };

        // --- Event Handlers ---
        async function handleConsent() {
            console.log('📝 Submitting consent...');
            try {
                await api.request('/UserConsent/', {
                    method: 'POST',
                    body: JSON.stringify({ consent_version: CURRENT_CONSENT_VERSION })
                });
                console.log('✅ Consent accepted');
                state.showConsent = false;
                
                // Initialize app after consent
                await initializeApp();
            } catch (error) {
                console.error('❌ Consent error:', error);
                alert('Error submitting consent. Please try again.');
            }
        }

        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('login-error');
            
            console.log('🔐 Attempting login...');
            
            try {
                const data = await api.request('/login/', {
                    method: 'POST',
                    body: JSON.stringify({ username, password })
                });
                
                console.log('✅ Login response:', data);
                
                if (data.access && data.refresh) {
                    api.setTokens(data.access, data.refresh);
                    state.isAuthenticated = true;
                    
                    console.log('🔑 Tokens saved, checking consent...');
                    
                    // Check for consent
                    if (api.needsConsent()) {
                        console.log('⚠️ Consent needed');
                        state.showConsent = true;
                        render();
                    } else {
                        console.log('✅ Consent already given, initializing app...');
                        await initializeApp();
                    }
                } else {
                    throw new Error('Invalid response from server');
                }
            } catch (error) {
                console.error('❌ Login error:', error);
                errorDiv.textContent = 'Invalid credentials or server error';
                errorDiv.classList.remove('hidden');
            }
        }

        async function handleRegister(event) {
            event.preventDefault();
            const username = document.getElementById('reg-username').value;
            const email = document.getElementById('reg-email').value;
            const password = document.getElementById('reg-password').value;
            const errorDiv = document.getElementById('register-error');
            
            try {
                await api.request('/register/', {
                    method: 'POST',
                    body: JSON.stringify({ username, email, password })
                });
                alert('Registration successful! Please login.');
                switchToLogin();
            } catch (error) {
                errorDiv.textContent = error.message || 'Registration failed';
                errorDiv.classList.remove('hidden');
            }
        }

        function switchToRegister() {
            state.currentView = 'register';
            render();
        }

        function switchToLogin() {
            state.currentView = 'login';
            render();
        }

        async function initializeApp() {
            console.log('🚀 Starting app initialization...');
            
            try {
                // Get drill down list
                console.log('📋 Fetching drill down list...');
                const drillDownData = await api.request('/UserDrillDown/');
                console.log('✅ Drill down data:', drillDownData);
                
                if (drillDownData && drillDownData.length > 0) {
                    state.drillDownList = drillDownData[0].content || [];
                    state.hasTeam = state.drillDownList.length > 0 && state.drillDownList[0].has_team;
                    console.log('👥 Has team:', state.hasTeam);
                }

                // Get chat sessions - automatically on login
                console.log('💬 Fetching chat sessions...');
                const sessions = await api.request('/Chats/');
                console.log('✅ Chat sessions:', sessions);
                
                // Sort sessions by last_updated date (most recent first)
                if (Array.isArray(sessions)) {
                    state.sessions = sessions.sort((a, b) => {
                        return new Date(b.last_updated) - new Date(a.last_updated);
                    });
                } else {
                    state.sessions = [];
                }

                // Get personal dashboard
                console.log('📊 Fetching personal dashboard...');
                const dashboard = await api.request('/UserDashboard/');
                console.log('✅ Dashboard data:', dashboard);
                
                if (dashboard && dashboard.length > 0) {
                    state.dashboardData = dashboard[0];
                }

                state.currentView = 'dashboard';
                console.log('✅ Initialization complete!');
                render();
            } catch (error) {
                console.error('❌ Initialization error:', error);
                console.error('Error details:', error.message);
                // Still render to show the user something
                state.currentView = 'dashboard';
                render();
            }
        }

        async function loadChatHistory(sessionId) {
            try {
                const chatData = await api.request(`/ChatData/?chat_id=${sessionId}`);
                if (chatData && chatData.length > 0) {
                    state.messages = chatData[0].content || [];
                } else {
                    state.messages = [];
                }
                render();
            } catch (error) {
                console.error('Error loading chat:', error);
                state.messages = [];
                render();
            }
        }

        async function handleSendMessage(event) {
            event.preventDefault();
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            
            if (!message) return;

            // If no active session, create one
            if (!state.activeSessionId) {
                try {
                    const newSession = await api.request('/Chats/', {
                        method: 'POST',
                        body: JSON.stringify({
                            title: message.substring(0, 30) + '...',
                            AiMode: 'therapy'
                        })
                    });
                    state.activeSessionId = newSession.id;
                    
                    // Refresh and sort sessions
                    const sessions = await api.request('/Chats/');
                    state.sessions = sessions.sort((a, b) => {
                        return new Date(b.last_updated) - new Date(a.last_updated);
                    });
                } catch (error) {
                    console.error('Error creating session:', error);
                    return;
                }
            }

            // Add user message to UI
            state.messages.push({ role: 'user', content: message });
            input.value = '';
            render();

            // Stream AI response
            try {
                const response = await fetch(`${API_BASE}/ChatData/continue_chat/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${api.accessToken}`
                    },
                    body: JSON.stringify({
                        prompt: message,
                        mode: 'therapy',
                        ChatID: state.activeSessionId
                    })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let aiResponse = '';
                
                const streamingDiv = document.getElementById('streaming-message');
                streamingDiv.innerHTML = '<div class="flex justify-start"><div class="bg-slate-800 text-slate-200 rounded-2xl px-4 py-3 max-w-2xl"><p class="text-sm whitespace-pre-wrap" id="ai-response"></p></div></div>';
                
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value);
                    aiResponse += chunk;
                    document.getElementById('ai-response').textContent = aiResponse;
                    
                    // Auto scroll
                    const chatMessages = document.getElementById('chat-messages');
                    chatMessages.scrollTop = chatMessages.scrollHeight;
                }

                // Add AI response to messages
                state.messages.push({ role: 'assistant', content: aiResponse });
                
                // Refresh sessions list to update last_updated timestamp
                const sessions = await api.request('/Chats/');
                state.sessions = sessions.sort((a, b) => {
                    return new Date(b.last_updated) - new Date(a.last_updated);
                });
                
                render();
            } catch (error) {
                console.error('Error sending message:', error);
            }
        }

        async function handleFeedbackSubmit(event) {
            event.preventDefault();
            const feedback = document.getElementById('feedback-text').value;
            const rating = document.getElementById('feedback-rating').value;
            
            try {
                await api.request('/UserFeedback/', {
                    method: 'POST',
                    body: JSON.stringify({ feedback, rating: parseInt(rating) })
                });
                
                document.getElementById('feedback-success').textContent = 'Thank you for your feedback!';
                document.getElementById('feedback-success').classList.remove('hidden');
                document.getElementById('feedback-text').value = '';
                
                setTimeout(() => {
                    document.getElementById('feedback-success').classList.add('hidden');
                }, 3000);
            } catch (error) {
                console.error('Feedback error:', error);
            }
        }

        async function handleHumanHelp() {
            if (!confirm('Request human therapist assistance? Your information will be shared with our support team.')) {
                return;
            }
            
            try {
                const userData = await api.request('/UserDrillDown/');
                const userName = userData[0]?.content[0]?.name || 'Anonymous';
                
                await api.request('/TherapistNeeded/', {
                    method: 'POST',
                    body: JSON.stringify({ users_in_need: [userName] })
                });
                
                alert('Your request has been submitted. A human therapist will contact you soon.');
            } catch (error) {
                console.error('Human help error:', error);
                alert('Failed to submit request. Please try again.');
            }
        }

        function handleLogout() {
            api.clearTokens();
            state = {
                isAuthenticated: false,
                currentView: 'login',
                showConsent: false,
                sessions: [],
                activeSessionId: null,
                messages: [],
                drillDownList: [],
                hasTeam: false,
                dashboardData: null,
                teamData: null,
                subordinateData: null,
                currentSubordinateInfo: null,
                sidebarCollapsed: true,
                newChatModalOpen: false
            };
            render();
        }

        async function navigateTo(view) {
            state.currentView = view;
            
            if (view === 'teamDashboard' && state.drillDownList.length > 0) {
                const userId = state.drillDownList[0].node_id;
                try {
                    const teamData = await api.request(`/DashBoardData/${userId}/health_dashboard/`);
                    state.teamData = teamData;
                } catch (error) {
                    console.error('Error loading team dashboard:', error);
                }
            }
            
            render();
        }

        async function viewSubordinateData(nodeId) {
            try {
                const memberInfo = state.drillDownList.find(m => m.node_id === nodeId);
                state.currentSubordinateInfo = memberInfo;
                
                const data = await api.request(`/DashBoardData/${nodeId}/health_dashboard/`);
                state.subordinateData = data;
                state.currentView = 'subordinateDashboard';
                render();
            } catch (error) {
                console.error('Error loading subordinate data:', error);
                state.subordinateData = null;
                state.currentView = 'subordinateDashboard';
                render();
            }
        }

        function goToTeamDashboard() {
            navigateTo('teamDashboard');
        }

        function handleSessionClick(sessionId) {
            state.activeSessionId = sessionId;
            state.currentView = 'chat';
            loadChatHistory(sessionId);
        }

        async function handleDeleteChat(sessionId) {
            if (!confirm('Delete this chat session?')) return;
            
            try {
                await api.request(`/Chats/${sessionId}/`, { method: 'DELETE' });
                
                // Refresh the sessions list
                const sessions = await api.request('/Chats/');
                state.sessions = sessions.sort((a, b) => {
                    return new Date(b.last_updated) - new Date(a.last_updated);
                });
                
                if (state.activeSessionId === sessionId) {
                    state.activeSessionId = null;
                    state.messages = [];
                }
                render();
            } catch (error) {
                console.error('Delete error:', error);
            }
        }

        function toggleSidebar() {
            state.sidebarCollapsed = !state.sidebarCollapsed;
            render();
        }

        function openNewChatModal() {
            state.newChatModalOpen = true;
            render();
        }

        function closeNewChatModal() {
            state.newChatModalOpen = false;
            render();
        }

        async function handleCreateNewChat(event) {
            event.preventDefault();
            const title = document.getElementById('new-chat-title').value;
            const mode = document.getElementById('new-chat-mode').value;
            
            try {
                const newSession = await api.request('/Chats/', {
                    method: 'POST',
                    body: JSON.stringify({ title, AiMode: mode })
                });
                
                // Refresh sessions list and sort by date
                const sessions = await api.request('/Chats/');
                state.sessions = sessions.sort((a, b) => {
                    return new Date(b.last_updated) - new Date(a.last_updated);
                });
                
                state.activeSessionId = newSession.id;
                state.messages = [];
                state.currentView = 'chat';
                state.newChatModalOpen = false;
                render();
            } catch (error) {
                console.error('Create chat error:', error);
            }
        }

        // --- Render Function ---
        function render() {
            const root = document.getElementById('root');
            
            if (state.showConsent) {
                root.innerHTML = ConsentModal({ onConsent: handleConsent });
                return;
            }
            
            if (!state.isAuthenticated) {
                if (state.currentView === 'register') {
                    root.innerHTML = Register();
                } else {
                    root.innerHTML = Login({ onLogin: handleLogin, onSwitchToRegister: switchToRegister });
                }
                return;
            }

            // Main App Layout
            let mainContent = '';
            switch (state.currentView) {
                case 'dashboard':
                    mainContent = Dashboard({ dashboardData: state.dashboardData });
                    break;
                case 'teamDashboard':
                    mainContent = TeamDashboard({ teamData: state.teamData, drillDownList: state.drillDownList });
                    break;
                case 'subordinateDashboard':
                    mainContent = SubordinateDashboard({ subordinateData: state.subordinateData, memberInfo: state.currentSubordinateInfo });
                    break;
                case 'chat':
                    mainContent = ChatInterface({ messages: state.messages, activeSessionId: state.activeSessionId });
                    break;
                case 'feedback':
                    mainContent = FeedbackForm();
                    break;
            }

            root.innerHTML = `
                <style>
                    body { font-family: 'Inter', sans-serif; }
                    ::-webkit-scrollbar { width: 6px; }
                    ::-webkit-scrollbar-track { background: transparent; }
                    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
                </style>

                <div class="flex h-screen bg-[#0f172a]">
                    <!-- Sidebar -->
                    <aside class="${state.sidebarCollapsed ? 'w-20' : 'w-64'} bg-[#1e293b] border-r border-slate-800 flex flex-col p-4 transition-all duration-300">
                        <div class="flex items-center justify-between mb-8">
                            ${!state.sidebarCollapsed ? '<h1 class="text-xl font-bold text-white">AI Psychologist</h1>' : ''}
                            <button onclick="toggleSidebar()" class="p-2 hover:bg-slate-800 rounded-lg transition-colors">
                                ${Icon({ name: 'menu', size: 20, className: 'text-slate-400' })}
                            </button>
                        </div>

                        <div class="space-y-2">
                            <button onclick="navigateTo('dashboard')" class="w-full h-10 rounded-md flex items-center px-3 ${state.currentView === 'dashboard' ? 'bg-slate-800 text-indigo-400' : 'text-slate-400 hover:bg-slate-800 hover:text-indigo-400'} transition-colors">
                                ${Icon({ name: 'dashboard', size: 20 })}
                                ${!state.sidebarCollapsed ? '<span class="ml-3 text-sm font-medium">Dashboard</span>' : ''}
                            </button>

                            ${state.hasTeam ? `
                                <button onclick="navigateTo('teamDashboard')" class="w-full h-10 rounded-md flex items-center px-3 ${state.currentView === 'teamDashboard' ? 'bg-slate-800 text-indigo-400' : 'text-slate-400 hover:bg-slate-800 hover:text-indigo-400'} transition-colors">
                                    ${Icon({ name: 'users', size: 20 })}
                                    ${!state.sidebarCollapsed ? '<span class="ml-3 text-sm font-medium">Team Dashboard</span>' : ''}
                                </button>
                            ` : ''}

                            <button onclick="openNewChatModal()" class="w-full h-10 rounded-md flex items-center px-3 ${state.currentView === 'chat' ? 'bg-slate-800 text-indigo-400' : 'text-slate-400 hover:bg-slate-800 hover:text-indigo-400'} transition-colors">
                                ${Icon({ name: 'messageSquare', size: 20 })}
                                ${!state.sidebarCollapsed ? '<span class="ml-3 text-sm font-medium">New Chat</span>' : ''}
                            </button>

                            <button onclick="navigateTo('feedback')" class="w-full h-10 rounded-md flex items-center px-3 ${state.currentView === 'feedback' ? 'bg-slate-800 text-indigo-400' : 'text-slate-400 hover:bg-slate-800 hover:text-indigo-400'} transition-colors">
                                ${Icon({ name: 'thumbsUp', size: 20 })}
                                ${!state.sidebarCollapsed ? '<span class="ml-3 text-sm font-medium">Feedback</span>' : ''}
                            </button>
                        </div>

                        ${!state.sidebarCollapsed ? `
                            <div class="mt-6 flex-1 overflow-y-auto">
                                <h3 class="px-3 text-xs font-bold text-slate-500 uppercase mb-2">Recent Sessions</h3>
                                <div class="space-y-1">
                                    ${state.sessions.map(session => {
                                        const date = new Date(session.last_updated);
                                        const dateStr = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                                        return `
                                        <div class="flex items-center gap-1">
                                            <button onclick="handleSessionClick('${session.id}')" class="flex-1 rounded-md px-3 py-2 ${state.activeSessionId === session.id ? 'bg-slate-800 text-indigo-400' : 'text-slate-400 hover:bg-slate-800'} transition-colors text-left">
                                                <div class="flex items-center gap-2 mb-1">
                                                    ${Icon({ name: 'messageSquare', size: 16 })}
                                                    <span class="text-xs truncate flex-1">${session.title}</span>
                                                </div>
                                                <div class="flex items-center gap-2 ml-5">
                                                    <span class="text-[10px] text-slate-600">${dateStr}</span>
                                                </div>
                                            </button>
                                            <button onclick="handleDeleteChat('${session.id}')" class="p-2 text-slate-600 hover:text-red-400 rounded transition-colors">
                                                ${Icon({ name: 'trash', size: 16 })}
                                            </button>
                                        </div>
                                    `}).join('')}
                                    ${state.sessions.length === 0 ? '<p class="px-3 text-xs text-slate-600 italic">No sessions</p>' : ''}
                                </div>
                            </div>
                        ` : ''}

                        <div class="mt-auto border-t border-slate-800 pt-4 space-y-2">
                            <button onclick="handleHumanHelp()" class="w-full h-10 rounded-md flex items-center px-3 text-slate-400 hover:bg-slate-800 hover:text-rose-400 transition-colors">
                                ${Icon({ name: 'user', size: 20 })}
                                ${!state.sidebarCollapsed ? '<span class="ml-3 text-sm font-medium">Human Help</span>' : ''}
                            </button>
                            <button onclick="handleLogout()" class="w-full h-10 rounded-md flex items-center px-3 text-slate-400 hover:bg-slate-800 hover:text-red-400 transition-colors">
                                ${Icon({ name: 'logOut', size: 20 })}
                                ${!state.sidebarCollapsed ? '<span class="ml-3 text-sm font-medium">Logout</span>' : ''}
                            </button>
                        </div>
                    </aside>

                    <!-- Main Content -->
                    <main class="flex-1 p-8 overflow-y-auto">
                        ${mainContent}
                    </main>
                </div>

                <!-- New Chat Modal -->
                ${state.newChatModalOpen ? `
                    <div class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50">
                        <div class="bg-[#1e293b] rounded-2xl p-8 w-full max-w-md border border-slate-700">
                            <h2 class="text-2xl font-bold text-white mb-6">Start New Session</h2>
                            <form onsubmit="handleCreateNewChat(event)" class="space-y-6">
                                <div>
                                    <label class="block text-sm font-medium text-slate-300 mb-2">Session Name</label>
                                    <input type="text" id="new-chat-title" required class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="e.g. Anxiety check-in..." />
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-300 mb-2">Select Mode</label>
                                    <select id="new-chat-mode" class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                        <option value="therapy">Therapy AI</option>
                                        <option value="counsellor">Counsellor AI</option>
                                    </select>
                                </div>
                                <div class="flex gap-3">
                                    <button type="button" onclick="closeNewChatModal()" class="flex-1 py-3 rounded-xl border border-slate-600 text-slate-300 hover:bg-slate-800 transition-colors">Cancel</button>
                                    <button type="submit" class="flex-1 py-3 rounded-xl bg-indigo-600 text-white font-bold hover:bg-indigo-500 transition-colors">Start Chat</button>
                                </div>
                            </form>
                        </div>
                    </div>
                ` : ''}
            `;
        }

        // --- Initialize on load ---
        window.addEventListener('DOMContentLoaded', async () => {
            console.log('🌐 DOM Content Loaded');
            console.log('🔍 Checking for existing tokens...');
            
            if (localStorage.getItem('access_token')) {
                console.log('✅ Tokens found');
                state.isAuthenticated = true;
                
                if (api.needsConsent()) {
                    console.log('⚠️ Consent needed');
                    state.showConsent = true;
                    render();
                } else {
                    console.log('✅ No consent needed, initializing app...');
                    await initializeApp();
                }
            } else {
                console.log('ℹ️ No tokens found, showing login');
                render();
            }
        });
    </script>
</body>
</html>
