<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://cdn.tailwindcss.com"></script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<body class="bg-[#0f172a] text-slate-100">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback, useRef } = React;

        // --- Configuration ---
        const API_BASE = 'https://scales-newsletter-roads-hartford.trycloudflare.com/'; 
        const CONSENT_VERSION = "v2.0";

        // --- Icons (Lucide) ---
        const IconWrapper = ({ children, size = 24, className = "", ...props }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className} {...props}>{children}</svg>
        );

        const Icons = {
            MessageSquare: (p) => <IconWrapper {...p}><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></IconWrapper>,
            AlertCircle: (p) => <IconWrapper {...p}><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></IconWrapper>,
            LogOut: (p) => <IconWrapper {...p}><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></IconWrapper>,
            Menu: (p) => <IconWrapper {...p}><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="18" x2="20" y2="18"/></IconWrapper>,
            X: (p) => <IconWrapper {...p}><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></IconWrapper>,
            LayoutDashboard: (p) => <IconWrapper {...p}><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></IconWrapper>,
            ChevronRight: (p) => <IconWrapper {...p}><polyline points="9 18 15 12 9 6"/></IconWrapper>,
            User: (p) => <IconWrapper {...p}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></IconWrapper>,
            Shield: (p) => <IconWrapper {...p}><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></IconWrapper>,
            Lock: (p) => <IconWrapper {...p}><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></IconWrapper>,
            Square: (p) => <IconWrapper {...p}><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/></IconWrapper>,
            ChevronDown: (p) => <IconWrapper {...p}><polyline points="6 9 12 15 18 9"/></IconWrapper>,
            ChevronUp: (p) => <IconWrapper {...p}><polyline points="18 15 12 9 6 15"/></IconWrapper>,
            Activity: (p) => <IconWrapper {...p}><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></IconWrapper>,
            Brain: (p) => <IconWrapper {...p}><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5 2.5 2.5 0 0 1 14.5 2a2.5 2.5 0 0 1 2.5 2.5V7h-5V4.5A2.5 2.5 0 0 1 9.5 2z"/><path d="M12 7v4"/><path d="M12 11a4 4 0 0 0-4 4v3a2 2 0 0 0 2 2h4a2 2 0 0 0 2-2v-3a4 4 0 0 0-4-4z"/></IconWrapper>, 
            Users: (p) => <IconWrapper {...p}><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></IconWrapper>,
            Clock: (p) => <IconWrapper {...p}><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></IconWrapper>,
            Send: (p) => <IconWrapper {...p}><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></IconWrapper>,
            Star: (p) => <IconWrapper {...p}><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></IconWrapper>,
            ThumbsUp: (p) => <IconWrapper {...p}><path d="M14 9V5a3 3 0 0 0-3-3l-4 9v11h11.28a2 2 0 0 0 2-1.7l1.38-9a2 2 0 0 0-2-2.3zM7 22H4a2 2 0 0 1-2-2v-7a2 2 0 0 1 2-2h3"/></IconWrapper>,
            CheckCircle2: (p) => <IconWrapper {...p}><path d="M12 22c5.523 0 10-4.477 10-10S17.523 2 12 2 2 6.477 2 12s4.477 10 10 10z"/><path d="m9 12 2 2 4-4"/></IconWrapper>,
            Compass: (p) => <IconWrapper {...p}><circle cx="12" cy="12" r="10"/><polygon points="16.24 7.76 14.12 14.12 7.76 16.24 9.88 9.88 16.24 7.76"/></IconWrapper>,
            Lightbulb: (p) => <IconWrapper {...p}><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-1 1.5-2.5 1.5-4.1 0-3.2-2.8-5.7-6-5.7-3.2 0-6 2.5-6 5.7 0 1.6.5 3.1 1.5 4.1.8.8 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></IconWrapper>,
            Calendar: (p) => <IconWrapper {...p}><rect x="3" y="4" width="18" height="18" rx="2" ry="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></IconWrapper>,
            Trash2: (p) => <IconWrapper {...p}><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" y1="11" x2="10" y2="17"/><line x1="14" y1="11" x2="14" y2="17"/></IconWrapper>,
            Bot: (p) => <IconWrapper {...p}><rect x="3" y="11" width="18" height="10" rx="2"/><circle cx="12" cy="5" r="2"/><path d="M12 7v4"/><line x1="8" y1="16" x2="8" y2="16"/><line x1="16" y1="16" x2="16" y2="16"/></IconWrapper>,
            Stethoscope: (p) => <IconWrapper {...p}><path d="M4.8 2.3A.3.3 0 0 1 5 2h14a.3.3 0 0 1 .2.3v3.4a3 3 0 0 1-3 3H7.8a3 3 0 0 1-3-3V2.3Z"/><path d="M12 17v-8.3"/><path d="M8 17h8"/><path d="M12 17a4 4 0 0 1-4 4H5"/></IconWrapper>,
            HeartHandshake: (p) => <IconWrapper {...p}><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></IconWrapper>,
            Briefcase: (p) => <IconWrapper {...p}><rect x="2" y="7" width="20" height="14" rx="2" ry="2"/><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"/></IconWrapper>,
            AlertTriangle: (p) => <IconWrapper {...p}><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></IconWrapper>
        };

        // --- Global Styles ---
        const GlobalStyles = () => (
          <style>{`
            body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f1f5f9; }
            ::-webkit-scrollbar { width: 6px; height: 6px; }
            ::-webkit-scrollbar-track { background: transparent; }
            ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
            ::-webkit-scrollbar-thumb:hover { background: #475569; }
            .sidebar-transition { transition: width 0.3s ease; }
            .sidebar-label { transition: opacity 0.2s ease; }
            .sidebar-collapsed .sidebar-label { opacity: 0; display: none; }
            .fade-in { animation: fadeIn 0.3s ease-in-out; }
            @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
          `}</style>
        );

        // --- API Client ---
        class ApiClient {
          getTokens() {
            return {
                access: localStorage.getItem('access_token'),
                refresh: localStorage.getItem('refresh_token')
            }
          }

          setTokens(access, refresh) {
            localStorage.setItem('access_token', access);
            localStorage.setItem('refresh_token', refresh);
          }

          clearTokens() {
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
          }

          async request(endpoint, options = {}) {
            let url = endpoint.startsWith('http') ? endpoint : `${API_BASE}${endpoint}`;
            const headers = { 'Content-Type': 'application/json', ...options.headers };
            const { access } = this.getTokens();
            if (access) headers['Authorization'] = `Bearer ${access}`;

            try {
              let response = await fetch(url, { ...options, headers });
              
              if (response.status === 401) {
                  // Simple refresh logic attempt
                  const refreshed = await this.refreshAccessToken();
                  if (refreshed) {
                      headers['Authorization'] = `Bearer ${localStorage.getItem('access_token')}`;
                      response = await fetch(url, { ...options, headers });
                  } else {
                      this.clearTokens();
                      window.location.reload();
                      throw new Error('Session Expired');
                  }
              }

              if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                throw new Error(errorData.detail || errorData.error || `Error: ${response.status}`);
              }
              return await response.json();
            } catch (error) { throw error; }
          }

          async refreshAccessToken() {
            const { refresh } = this.getTokens();
            if(!refresh) return false;
            try {
              const res = await fetch(`${API_BASE}/refresh/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ refresh }),
              });
              if(res.ok) {
                  const data = await res.json();
                  this.setTokens(data.access, refresh);
                  return true;
              }
              return false;
            } catch(e) { return false; }
          }
        }
        const api = new ApiClient();

        // --- Components ---

        // 1. Consent Modal
        const ConsentModal = ({ onConsentGiven }) => {
            const [isVisible, setIsVisible] = useState(false);

            useEffect(() => {
                const hasConsent = localStorage.getItem('consent_version_held') === CONSENT_VERSION;
                if (!hasConsent) setIsVisible(true);
            }, []);

            const handleAccept = async () => {
                try {
                    // Send to backend
                    await api.request('/UserConsent/', {
                        method: 'POST',
                        body: JSON.stringify({ consent_version: CONSENT_VERSION })
                    });
                    // Set local flag to unblock UI immediately
                    localStorage.setItem('consent_version_held', CONSENT_VERSION);
                    setIsVisible(false);
                    onConsentGiven();
                } catch (e) {
                    console.error("Consent failed", e);
                    alert("Failed to save consent. Please try again.");
                }
            };

            if (!isVisible) return null;

            return (
                <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-[60] flex items-end sm:items-center justify-center p-4 fade-in">
                    <div className="bg-[#1e293b] w-full max-w-lg rounded-2xl p-8 border border-slate-700 shadow-2xl relative">
                        <div className="flex items-center gap-3 mb-4 text-indigo-400">
                            <Icons.Shield size={32} />
                            <h2 className="text-xl font-bold text-white">Privacy & Consent</h2>
                        </div>
                        <p className="text-slate-300 text-sm leading-relaxed mb-6">
                            We value your privacy. Before you continue, please acknowledge that this platform uses AI to analyze chat data for wellness purposes. Your data is processed securely.
                        </p>
                        <button 
                            onClick={handleAccept}
                            className="w-full py-3 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl transition-colors shadow-lg shadow-indigo-500/20"
                        >
                            I Agree & Continue
                        </button>
                    </div>
                </div>
            );
        };

        // 2. Auth: Login & Register
        const Login = ({ onLogin, onSwitchToRegister }) => {
          const [formData, setFormData] = useState({ username: '', password: '' });
          const [error, setError] = useState('');
          const [loading, setLoading] = useState(false);

          const handleSubmit = async (e) => {
            e.preventDefault();
            setLoading(true); setError('');
            try {
              const data = await api.request('/login/', { method: 'POST', body: JSON.stringify(formData) });
              api.setTokens(data.access, data.refresh);
              onLogin();
            } catch (err) { setError('Invalid credentials'); } 
            finally { setLoading(false); }
          };

          return (
            <div className="min-h-screen flex items-center justify-center bg-[#0f172a] px-4">
              <div className="max-w-md w-full space-y-8 p-10 bg-[#1e293b] rounded-2xl shadow-2xl border border-slate-700">
                <div className="text-center">
                  <div className="mx-auto h-16 w-16 bg-indigo-500 rounded-2xl flex items-center justify-center mb-6"><Icons.Brain className="text-white h-8 w-8" /></div>
                  <h2 className="text-3xl font-bold text-slate-100">AI Psychologist</h2>
                </div>
                <form className="mt-8 space-y-6" onSubmit={handleSubmit}>
                  <div className="space-y-4">
                    <input type="text" required className="block w-full px-4 py-3 border border-slate-700 rounded-xl bg-slate-800/50 text-slate-200 focus:ring-indigo-500 outline-none" placeholder="Username" onChange={e => setFormData({...formData, username: e.target.value})} />
                    <input type="password" required className="block w-full px-4 py-3 border border-slate-700 rounded-xl bg-slate-800/50 text-slate-200 focus:ring-indigo-500 outline-none" placeholder="Password" onChange={e => setFormData({...formData, password: e.target.value})} />
                  </div>
                  {error && <div className="p-3 bg-red-900/20 text-red-400 text-sm rounded-lg text-center">{error}</div>}
                  <button type="submit" disabled={loading} className="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl disabled:opacity-50">{loading ? 'Loading...' : 'Sign In'}</button>
                  <div className="text-center"><button type="button" onClick={onSwitchToRegister} className="text-sm text-indigo-400 hover:text-indigo-300">Create Account</button></div>
                </form>
              </div>
            </div>
          );
        };

        const Register = ({ onSwitchToLogin }) => {
          const [formData, setFormData] = useState({ username: '', email: '', password: '' });
          const [loading, setLoading] = useState(false);

          const handleSubmit = async (e) => {
            e.preventDefault();
            setLoading(true);
            try {
              await api.request('/register/', { method: 'POST', body: JSON.stringify(formData) });
              alert("Registered! Please login.");
              onSwitchToLogin();
            } catch (err) { alert(err.message); } 
            finally { setLoading(false); }
          };

          return (
            <div className="min-h-screen flex items-center justify-center bg-[#0f172a] px-4">
              <div className="max-w-md w-full space-y-8 p-10 bg-[#1e293b] rounded-2xl border border-slate-700">
                <h2 className="text-3xl font-bold text-center text-slate-100">Create Account</h2>
                <form className="mt-8 space-y-6" onSubmit={handleSubmit}>
                  <div className="space-y-4">
                    <input type="text" required className="block w-full px-4 py-3 border border-slate-700 rounded-xl bg-slate-800/50 text-slate-200 outline-none" placeholder="Username" onChange={e => setFormData({...formData, username: e.target.value})} />
                    <input type="email" required className="block w-full px-4 py-3 border border-slate-700 rounded-xl bg-slate-800/50 text-slate-200 outline-none" placeholder="Email" onChange={e => setFormData({...formData, email: e.target.value})} />
                    <input type="password" required className="block w-full px-4 py-3 border border-slate-700 rounded-xl bg-slate-800/50 text-slate-200 outline-none" placeholder="Password" onChange={e => setFormData({...formData, password: e.target.value})} />
                  </div>
                  <button type="submit" disabled={loading} className="w-full py-3.5 bg-indigo-600 text-white font-bold rounded-xl disabled:opacity-50">{loading ? 'Creating...' : 'Register'}</button>
                  <div className="text-center"><button type="button" onClick={onSwitchToLogin} className="text-sm text-indigo-400">Login instead</button></div>
                </form>
              </div>
            </div>
          );
        };

        // 3. Personal Dashboard
        const PersonalDashboard = () => {
            const [data, setData] = useState(null);
            const [loading, setLoading] = useState(true);

            useEffect(() => {
                const fetch = async () => {
                    try {
                        const res = await api.request('/UserDashboard/');
                        setData(Array.isArray(res) ? res[0] : res);
                    } catch(e) { console.error(e); } 
                    finally { setLoading(false); }
                };
                fetch();
            }, []);

            if (loading) return <div className="p-10 text-center text-slate-500">Loading Dashboard...</div>;
            if (!data) return <div className="p-10 text-center text-slate-500 border-2 border-dashed border-slate-800 rounded-3xl">No data available yet. Start chatting!</div>;

            // Assuming content is inside a 'content' field based on models or serializer
            // The user prompt says backend returns "content" JSONField. 
            // Let's assume the JSON structure matches the previous code examples.
            const content = data.content || {}; 
            const recs = content._personal_dashboard_data?.recommendation || []; 
            const problems = content._personal_dashboard_data?.common_problems || [];
            const summary = content._personal_dashboard_data?.summary || "Analyzing...";

            return (
                <div className="max-w-6xl mx-auto space-y-8 fade-in h-[calc(100vh-8rem)] overflow-y-auto pr-2 scrollbar-thin">
                    <div className="bg-gradient-to-r from-slate-800 to-slate-900 p-8 rounded-3xl border border-slate-700 shadow-xl">
                        <div className="flex items-center gap-3 mb-4 text-indigo-400">
                            <Icons.Activity /> <h2 className="uppercase tracking-widest font-bold text-sm">Status</h2>
                        </div>
                        <h1 className="text-2xl font-bold text-white">"{summary}"</h1>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div className="bg-[#1e293b] border border-slate-800 rounded-3xl p-6 shadow-lg h-96 flex flex-col">
                            <h3 className="flex items-center gap-2 font-bold text-slate-400 mb-4 uppercase text-xs tracking-widest">
                                <Icons.AlertCircle className="text-amber-500" size={16}/> Identified Patterns ({problems.length})
                            </h3>
                            <div className="flex-1 overflow-y-auto space-y-3 scrollbar-thin pr-2">
                                {problems.map((p, i) => (
                                    <div key={i} className="bg-slate-800/50 p-4 rounded-xl border border-slate-700/50">
                                        <h4 className="font-semibold text-slate-200 text-sm">{p.problem}</h4>
                                        {p.suggestion && <p className="text-xs text-slate-400 mt-1">{p.suggestion}</p>}
                                    </div>
                                ))}
                            </div>
                        </div>

                        <div className="bg-[#1e293b] border border-slate-800 rounded-3xl p-6 shadow-lg h-96 flex flex-col">
                            <h3 className="flex items-center gap-2 font-bold text-slate-400 mb-4 uppercase text-xs tracking-widest">
                                <Icons.Lightbulb className="text-indigo-500" size={16}/> Recommendations ({recs.length})
                            </h3>
                            <div className="flex-1 overflow-y-auto space-y-3 scrollbar-thin pr-2">
                                {recs.map((r, i) => (
                                    <div key={i} className="bg-slate-800/50 p-4 rounded-xl border border-slate-700/50 flex gap-3">
                                        <span className="flex-shrink-0 w-6 h-6 rounded-full bg-indigo-500/20 text-indigo-400 flex items-center justify-center text-xs font-bold">{i+1}</span>
                                        <div>
                                            <h4 className="font-semibold text-slate-200 text-sm">{r.recommendation}</h4>
                                            {r.logic && <p className="text-xs text-slate-500 mt-1 italic">{r.logic}</p>}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        // 4. Company Dashboard & Team Drill Down
        const CompanyDashboard = ({ userNodeId }) => {
            const [viewId, setViewId] = useState(userNodeId); // Current ID being viewed
            const [data, setData] = useState(null);
            const [drillDown, setDrillDown] = useState([]);
            const [loading, setLoading] = useState(false);
            const [error, setError] = useState(null);

            // Fetch Dashboard Data for a specific Node
            const fetchDashboard = async (nodeId) => {
                setLoading(true); setError(null);
                try {
                    // Using logic: GET /DashBoardData/{id}/health_dashboard/
                    const res = await api.request(`/DashBoardData/${nodeId}/health_dashboard/`);
                    setData(res); // Expected: { node:..., content: {...} } or similar
                } catch (e) {
                    setError("Restricted Access or No Data Available.");
                    setData(null);
                } finally { setLoading(false); }
            };

            // Initial fetch of drilldown list to populate the sidebar list
            useEffect(() => {
                const init = async () => {
                    try {
                        const ddRes = await api.request('/UserDrillDown/');
                        // UserDrillDown returns { content: [ {node_id, name...}, ... ] }
                        // Based on serializer, it might be a list of objects.
                        const list = Array.isArray(ddRes) && ddRes.length > 0 ? ddRes[0].content : [];
                        setDrillDown(list);
                        
                        // Load initial view (User's team)
                        fetchDashboard(viewId);
                    } catch(e) { console.error(e); }
                };
                init();
            }, []);

            // Handle clicking a subordinate
            const handleMemberClick = (id) => {
                setViewId(id);
                fetchDashboard(id);
            };

            const TeamContent = data?.content || {}; // Safety check
            const problems = TeamContent.common_problems || []; // Adjust based on actual JSON key from AI task
            const recs = TeamContent.recommendations || [];
            const policies = TeamContent.policy_changes || [];

            // Filter drilldown: Exclude current view if it's the user, show others as subordinates
            // The prompt says: "list of all the ids just below the user".
            // Since drillDown[0] is the user, drillDown[1:] are subordinates.
            const subordinates = drillDown.filter(m => m.node_id !== userNodeId);

            return (
                <div className="flex h-[calc(100vh-8rem)] gap-6 fade-in">
                    {/* Main Content Area */}
                    <div className="flex-1 overflow-y-auto scrollbar-thin pr-2">
                         <div className="mb-6 flex items-center justify-between">
                             <div>
                                 <h1 className="text-2xl font-bold text-white mb-1">
                                     {viewId === userNodeId ? "My Department Overview" : "Subordinate Team View"}
                                 </h1>
                                 <p className="text-xs text-slate-400">Node ID: {viewId}</p>
                             </div>
                             {viewId !== userNodeId && (
                                 <button onClick={() => handleMemberClick(userNodeId)} className="px-4 py-2 bg-slate-700 rounded-lg text-sm hover:bg-slate-600 transition">
                                     Back to My Team
                                 </button>
                             )}
                         </div>

                         {loading && <div className="text-center p-10 text-slate-500 animate-pulse">Analyzing Team Metrics...</div>}
                         
                         {error && (
                             <div className="p-8 border border-red-900/50 bg-red-900/10 rounded-3xl text-center">
                                 <Icons.Lock className="mx-auto mb-4 text-red-400" size={32}/>
                                 <h3 className="text-red-400 font-bold mb-2">Access Restricted</h3>
                                 <p className="text-red-300 text-sm">{error}</p>
                             </div>
                         )}

                         {!loading && !error && data && (
                             <div className="space-y-6">
                                 {/* Summary Cards */}
                                 <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                     <div className="bg-[#1e293b] p-6 rounded-3xl border border-slate-700">
                                         <h3 className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4">Issues</h3>
                                         <div className="h-48 overflow-y-auto scrollbar-thin space-y-3">
                                             {problems.map((p, i) => (
                                                 <div key={i} className="bg-slate-800/50 p-3 rounded-xl text-sm border border-slate-700/50">
                                                     {typeof p === 'string' ? p : p.problem || JSON.stringify(p)}
                                                 </div>
                                             ))}
                                         </div>
                                     </div>
                                     <div className="bg-[#1e293b] p-6 rounded-3xl border border-slate-700">
                                         <h3 className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4">Recommendations</h3>
                                         <div className="h-48 overflow-y-auto scrollbar-thin space-y-3">
                                             {recs.map((r, i) => (
                                                 <div key={i} className="flex gap-2 text-sm text-slate-300">
                                                     <Icons.CheckCircle2 size={16} className="text-emerald-500 shrink-0 mt-0.5"/>
                                                     <span>{typeof r === 'string' ? r : r.recommendation}</span>
                                                 </div>
                                             ))}
                                         </div>
                                     </div>
                                     <div className="bg-[#1e293b] p-6 rounded-3xl border border-slate-700">
                                         <h3 className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4">Policy Updates</h3>
                                         <div className="h-48 overflow-y-auto scrollbar-thin space-y-3">
                                             {policies.map((p, i) => (
                                                 <div key={i} className="bg-indigo-900/20 p-3 rounded-xl text-sm border border-indigo-500/30 text-indigo-300">
                                                     {typeof p === 'string' ? p : p.title}
                                                 </div>
                                             ))}
                                         </div>
                                     </div>
                                 </div>
                             </div>
                         )}
                    </div>

                    {/* Drill Down Sidebar */}
                    <div className="w-80 bg-[#1e293b] border border-slate-800 rounded-3xl p-6 flex flex-col shrink-0">
                        <h3 className="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4 flex items-center gap-2">
                            <Icons.Users size={16}/> Direct Reports
                        </h3>
                        <div className="flex-1 overflow-y-auto scrollbar-thin space-y-2">
                            {subordinates.map((sub, i) => (
                                <button 
                                    key={i}
                                    onClick={() => handleMemberClick(sub.node_id)}
                                    className={`w-full text-left p-4 rounded-xl border transition-all ${
                                        viewId === sub.node_id 
                                        ? 'bg-indigo-600 border-indigo-500 shadow-lg shadow-indigo-500/20' 
                                        : 'bg-slate-800/50 border-slate-700 hover:bg-slate-700'
                                    }`}
                                >
                                    <div className="font-bold text-sm truncate">{sub.name}</div>
                                    <div className="text-xs opacity-70 truncate">{sub.title}</div>
                                    {sub.has_team && (
                                        <div className="mt-2 text-[10px] uppercase bg-slate-900/50 inline-block px-2 py-0.5 rounded text-emerald-400 font-bold tracking-wide">
                                            Has Team
                                        </div>
                                    )}
                                </button>
                            ))}
                            {subordinates.length === 0 && <div className="text-slate-500 text-sm italic">No direct reports found.</div>}
                        </div>
                    </div>
                </div>
            );
        };

        // 5. Chat Interface
        const ChatInterface = () => {
            const [chats, setChats] = useState([]); // Sidebar list
            const [activeChatId, setActiveChatId] = useState(null);
            const [messages, setMessages] = useState([]);
            const [input, setInput] = useState('');
            const [loading, setLoading] = useState(false);
            const [isNewModalOpen, setIsNewModalOpen] = useState(false);
            const [newChatTitle, setNewChatTitle] = useState('');
            const [newChatMode, setNewChatMode] = useState('therapy');
            
            const messagesEndRef = useRef(null);

            // Fetch chat list
            const fetchChats = async () => {
                try {
                    const res = await api.request('/Chats/');
                    setChats(res);
                } catch(e) { console.error(e); }
            };

            useEffect(() => { fetchChats(); }, []);

            // Load messages for active chat
            useEffect(() => {
                if(!activeChatId) { setMessages([]); return; }
                const load = async () => {
                    try {
                        const res = await api.request(`/ChatData/?chat_id=${activeChatId}`);
                        const hist = res[0]?.content || [];
                        // Normalize content format
                        const formatted = hist.map(m => ({ 
                            role: m.role, 
                            content: m.message || m.content || "" 
                        }));
                        setMessages(formatted);
                    } catch(e) { console.error(e); }
                };
                load();
            }, [activeChatId]);

            // Auto-scroll
            useEffect(() => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages]);

            const handleDeleteChat = async (e, id) => {
                e.stopPropagation();
                if(!confirm("Delete this chat?")) return;
                try {
                    await api.request(`/Chats/${id}/`, { method: 'DELETE' });
                    fetchChats();
                    if(activeChatId === id) setActiveChatId(null);
                } catch(e) { alert("Failed to delete"); }
            };

            const handleCreateChat = async (e) => {
                e.preventDefault();
                try {
                    const res = await api.request('/Chats/', {
                        method: 'POST',
                        body: JSON.stringify({ title: newChatTitle, AiMode: newChatMode })
                    });
                    await fetchChats();
                    setActiveChatId(res.id);
                    setIsNewModalOpen(false);
                } catch(e) { alert("Error creating chat"); }
            };

            const handleSend = async (e) => {
                e.preventDefault();
                if(!input.trim()) return;

                const tempMsg = { role: 'user', content: input };
                setMessages(prev => [...prev, tempMsg, { role: 'assistant', content: '' }]);
                const currentInput = input;
                setInput('');
                setLoading(true);

                try {
                    const token = localStorage.getItem('access_token');
                    const response = await fetch(`${API_BASE}/ChatData/continue_chat/`, {
                        method: 'POST',
                        headers: { 
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${token}`
                        },
                        body: JSON.stringify({
                            ChatID: activeChatId,
                            prompt: currentInput,
                            mode: newChatMode // This might be static per chat in real app, but using state here
                        })
                    });

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let aiResponse = "";

                    while(true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        const chunk = decoder.decode(value, {stream: true});
                        aiResponse += chunk;
                        
                        setMessages(prev => {
                            const newArr = [...prev];
                            newArr[newArr.length - 1] = { role: 'assistant', content: aiResponse };
                            return newArr;
                        });
                    }

                } catch(e) {
                    setMessages(prev => [...prev, {role:'system', content: 'Error getting response.'}]);
                } finally { setLoading(false); }
            };

            return (
                <div className="flex h-[calc(100vh-8rem)] gap-6 fade-in">
                    {/* Chat Sidebar */}
                    <div className="w-64 bg-[#1e293b] rounded-3xl border border-slate-800 flex flex-col p-4 shrink-0">
                        <button onClick={() => setIsNewModalOpen(true)} className="w-full py-3 mb-4 bg-indigo-600 hover:bg-indigo-500 text-white font-bold rounded-xl flex items-center justify-center gap-2">
                            <Icons.Plus size={18}/> New Session
                        </button>
                        <div className="flex-1 overflow-y-auto space-y-2 scrollbar-thin">
                            {chats.map(c => (
                                <div 
                                    key={c.id} 
                                    onClick={() => setActiveChatId(c.id)}
                                    className={`p-3 rounded-xl cursor-pointer text-sm flex justify-between group ${activeChatId === c.id ? 'bg-slate-700 text-white' : 'hover:bg-slate-800 text-slate-400'}`}
                                >
                                    <span className="truncate pr-2">{c.title}</span>
                                    <button onClick={(e) => handleDeleteChat(e, c.id)} className="opacity-0 group-hover:opacity-100 hover:text-red-400"><Icons.Trash2 size={14}/></button>
                                </div>
                            ))}
                        </div>
                    </div>

                    {/* Chat Window */}
                    <div className="flex-1 bg-[#1e293b] rounded-3xl border border-slate-800 flex flex-col overflow-hidden relative">
                        {!activeChatId ? (
                            <div className="flex-1 flex flex-col items-center justify-center text-slate-500">
                                <Icons.MessageSquare size={48} className="mb-4 opacity-50"/>
                                <p>Select or create a chat to begin.</p>
                            </div>
                        ) : (
                            <>
                                <div className="flex-1 overflow-y-auto p-6 space-y-6 scrollbar-thin pb-24">
                                    {messages.map((m, i) => (
                                        <div key={i} className={`flex ${m.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                            <div className={`max-w-[80%] p-4 rounded-2xl whitespace-pre-wrap ${m.role === 'user' ? 'bg-indigo-600 text-white rounded-tr-sm' : 'bg-slate-800 text-slate-200 rounded-tl-sm'}`}>
                                                {m.content}
                                            </div>
                                        </div>
                                    ))}
                                    <div ref={messagesEndRef} />
                                </div>
                                <div className="absolute bottom-0 left-0 right-0 p-4 bg-[#1e293b] border-t border-slate-800">
                                    <form onSubmit={handleSend} className="relative">
                                        <input 
                                            value={input}
                                            onChange={e => setInput(e.target.value)}
                                            placeholder="Type your message..."
                                            className="w-full bg-slate-900 border border-slate-700 rounded-full py-3 pl-6 pr-12 text-white focus:outline-none focus:border-indigo-500"
                                            disabled={loading}
                                        />
                                        <button type="submit" disabled={loading} className="absolute right-2 top-2 p-1.5 bg-indigo-600 rounded-full text-white hover:bg-indigo-500 disabled:opacity-50">
                                            <Icons.Send size={18}/>
                                        </button>
                                    </form>
                                </div>
                            </>
                        )}
                    </div>

                    {/* New Chat Modal */}
                    {isNewModalOpen && (
                        <div className="fixed inset-0 bg-black/70 flex items-center justify-center z-50">
                            <div className="bg-[#1e293b] p-8 rounded-3xl w-96 border border-slate-700">
                                <h3 className="text-xl font-bold mb-6">New Session</h3>
                                <input 
                                    className="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 mb-4" 
                                    placeholder="Title (e.g., Work Stress)" 
                                    value={newChatTitle}
                                    onChange={e => setNewChatTitle(e.target.value)}
                                />
                                <div className="grid grid-cols-2 gap-4 mb-6">
                                    <button type="button" onClick={() => setNewChatMode('therapy')} className={`p-4 rounded-xl border flex flex-col items-center gap-2 ${newChatMode === 'therapy' ? 'bg-indigo-600/20 border-indigo-500 text-indigo-400' : 'bg-slate-800 border-slate-700'}`}>
                                        <Icons.Stethoscope /> <span className="text-xs font-bold">Therapy</span>
                                    </button>
                                    <button type="button" onClick={() => setNewChatMode('counsellor')} className={`p-4 rounded-xl border flex flex-col items-center gap-2 ${newChatMode === 'counsellor' ? 'bg-emerald-600/20 border-emerald-500 text-emerald-400' : 'bg-slate-800 border-slate-700'}`}>
                                        <Icons.HeartHandshake /> <span className="text-xs font-bold">Counselor</span>
                                    </button>
                                </div>
                                <div className="flex gap-3">
                                    <button onClick={() => setIsNewModalOpen(false)} className="flex-1 py-3 rounded-xl border border-slate-600">Cancel</button>
                                    <button onClick={handleCreateChat} className="flex-1 py-3 rounded-xl bg-indigo-600 font-bold">Create</button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        // 6. Feedback & Help
        const FeedbackView = ({ username }) => {
            const [type, setType] = useState('feedback'); // 'feedback' or 'help'
            const [form, setForm] = useState({ rating: 5, feedback: '' });
            const [submitted, setSubmitted] = useState(false);

            const submitFeedback = async (e) => {
                e.preventDefault();
                try {
                    await api.request('/UserFeedback/', { method: 'POST', body: JSON.stringify(form) });
                    setSubmitted(true);
                } catch(e) { alert("Error submitting feedback"); }
            };

            const submitHelp = async () => {
                try {
                    // Send username in list as requested
                    await api.request('/TherapistNeeded/', { 
                        method: 'POST', 
                        body: JSON.stringify({ users_in_need: [username] }) 
                    });
                    setSubmitted(true);
                } catch(e) { alert("Error requesting help"); }
            };

            if (submitted) return (
                <div className="flex flex-col items-center justify-center h-96 fade-in text-center">
                    <Icons.CheckCircle2 className="text-emerald-500 w-20 h-20 mb-4"/>
                    <h2 className="text-3xl font-bold">Received</h2>
                    <p className="text-slate-400">We've logged your request.</p>
                </div>
            );

            return (
                <div className="max-w-2xl mx-auto h-[calc(100vh-8rem)] flex items-center fade-in">
                    <div className="w-full bg-[#1e293b] p-8 rounded-3xl border border-slate-800">
                        <div className="flex gap-4 mb-8">
                            <button onClick={() => setType('feedback')} className={`flex-1 py-3 rounded-xl font-bold transition-all ${type === 'feedback' ? 'bg-indigo-600 text-white shadow-lg' : 'bg-slate-800 text-slate-400'}`}>Feedback</button>
                            <button onClick={() => setType('help')} className={`flex-1 py-3 rounded-xl font-bold transition-all ${type === 'help' ? 'bg-rose-600 text-white shadow-lg' : 'bg-slate-800 text-slate-400'}`}>Human Help</button>
                        </div>

                        {type === 'feedback' ? (
                            <form onSubmit={submitFeedback} className="space-y-6">
                                <div>
                                    <label className="block text-xs font-bold uppercase tracking-widest text-slate-500 mb-2">Rating</label>
                                    <div className="flex gap-2">
                                        {[1,2,3,4,5].map(s => (
                                            <Icons.Star key={s} size={32} className={`cursor-pointer ${form.rating >= s ? 'text-amber-400 fill-amber-400' : 'text-slate-600'}`} onClick={() => setForm({...form, rating: s})} />
                                        ))}
                                    </div>
                                </div>
                                <textarea 
                                    className="w-full bg-slate-900 border border-slate-700 rounded-xl p-4 h-32" 
                                    placeholder="Your thoughts..."
                                    value={form.feedback}
                                    onChange={e => setForm({...form, feedback: e.target.value})}
                                    required
                                />
                                <button className="w-full py-4 bg-indigo-600 rounded-xl font-bold hover:bg-indigo-500">Submit Feedback</button>
                            </form>
                        ) : (
                            <div className="text-center space-y-6">
                                <div className="w-20 h-20 bg-rose-500/20 rounded-full flex items-center justify-center mx-auto text-rose-500">
                                    <Icons.HeartHandshake size={40} />
                                </div>
                                <h3 className="text-xl font-bold">Request Human Intervention</h3>
                                <p className="text-slate-400 text-sm">A request will be sent to our administration team to connect {username} with a certified therapist.</p>
                                <button onClick={submitHelp} className="w-full py-4 bg-rose-600 rounded-xl font-bold hover:bg-rose-500">Request Therapist</button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        // --- Main App Shell ---
        const App = () => {
            const [user, setUser] = useState(null); // { username, ... } logic handled via tokens mostly
            const [view, setView] = useState('login'); // login, dashboard, team, chat, feedback
            const [drillDown, setDrillDown] = useState([]);
            const [canSeeTeam, setCanSeeTeam] = useState(false);
            const [userNodeId, setUserNodeId] = useState(null);

            // Check auth on load
            useEffect(() => {
                if(localStorage.getItem('access_token')) {
                    postLoginInit();
                }
            }, []);

            const postLoginInit = async () => {
                try {
                    // 1. Get Drill Down List
                    const ddRes = await api.request('/UserDrillDown/');
                    // Assuming list of objects, we take the first object's content list
                    const list = Array.isArray(ddRes) && ddRes.length > 0 ? ddRes[0].content : [];
                    
                    if (list.length > 0) {
                        const me = list[0]; // First occurrence is user
                        setDrillDown(list);
                        setUserNodeId(me.node_id);
                        setCanSeeTeam(me.has_team); 
                        setUser({ username: me.name }); // Approximate username from drilldown name
                    }
                    setView('dashboard');
                } catch(e) {
                    console.error("Init failed", e);
                    // If drilldown fails, maybe standard user without org node?
                    setView('dashboard');
                }
            };

            const handleLogout = () => {
                api.clearTokens();
                setUser(null);
                setView('login');
                localStorage.removeItem('consent_version_held'); // Optional: force consent again on relogin?
            };

            if (view === 'login' || view === 'register') {
                return (
                    <>
                        <GlobalStyles />
                        {view === 'login' 
                            ? <Login onLogin={postLoginInit} onSwitchToRegister={() => setView('register')} />
                            : <Register onSwitchToLogin={() => setView('login')} />
                        }
                    </>
                );
            }

            return (
                <>
                    <GlobalStyles />
                    <ConsentModal onConsentGiven={() => {}} /> {/* Blocks UI if needed */}
                    
                    <div className="flex flex-col h-screen overflow-hidden">
                        {/* Header */}
                        <header className="h-16 border-b border-slate-800 bg-[#0f172a] flex items-center justify-between px-6 shrink-0 z-20">
                            <div className="flex items-center gap-3">
                                <div className="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center"><Icons.Activity className="text-white" size={18}/></div>
                                <h1 className="font-bold tracking-wide text-sm">AI PSYCHOLOGIST</h1>
                            </div>
                            <button onClick={handleLogout} className="flex items-center gap-2 text-slate-400 hover:text-white text-sm">
                                <Icons.LogOut size={16}/> Sign Out
                            </button>
                        </header>

                        <div className="flex-1 flex overflow-hidden">
                            {/* Sidebar */}
                            <aside className="w-20 lg:w-64 bg-[#0f172a] border-r border-slate-800 flex flex-col items-center lg:items-stretch py-6 gap-2 shrink-0 z-10">
                                <button onClick={() => setView('dashboard')} className={`h-12 mx-3 rounded-xl flex items-center gap-4 px-4 transition-all ${view === 'dashboard' ? 'bg-slate-800 text-indigo-400' : 'text-slate-400 hover:bg-slate-800'}`}>
                                    <Icons.LayoutDashboard size={20} /> <span className="hidden lg:block font-medium text-sm">My Dashboard</span>
                                </button>
                                
                                {canSeeTeam && (
                                    <button onClick={() => setView('team')} className={`h-12 mx-3 rounded-xl flex items-center gap-4 px-4 transition-all ${view === 'team' ? 'bg-slate-800 text-indigo-400' : 'text-slate-400 hover:bg-slate-800'}`}>
                                        <Icons.Briefcase size={20} /> <span className="hidden lg:block font-medium text-sm">Company View</span>
                                    </button>
                                )}

                                <button onClick={() => setView('chat')} className={`h-12 mx-3 rounded-xl flex items-center gap-4 px-4 transition-all ${view === 'chat' ? 'bg-slate-800 text-indigo-400' : 'text-slate-400 hover:bg-slate-800'}`}>
                                    <Icons.MessageSquare size={20} /> <span className="hidden lg:block font-medium text-sm">Chat Sessions</span>
                                </button>

                                <button onClick={() => setView('feedback')} className={`h-12 mx-3 rounded-xl flex items-center gap-4 px-4 transition-all ${view === 'feedback' ? 'bg-slate-800 text-indigo-400' : 'text-slate-400 hover:bg-slate-800'}`}>
                                    <Icons.ThumbsUp size={20} /> <span className="hidden lg:block font-medium text-sm">Feedback & Help</span>
                                </button>
                            </aside>

                            {/* Main View */}
                            <main className="flex-1 bg-[#0f172a] p-6 lg:p-8 overflow-hidden relative">
                                {view === 'dashboard' && <PersonalDashboard />}
                                {view === 'team' && <CompanyDashboard userNodeId={userNodeId} />}
                                {view === 'chat' && <ChatInterface />}
                                {view === 'feedback' && <FeedbackView username={user?.username || "User"} />}
                            </main>
                        </div>
                    </div>
                </>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
