        // --- Utility: API Client ---
        class ApiClient {
          constructor() {
            if (typeof window !== 'undefined') {
              this.accessToken = localStorage.getItem('access_token');
              this.refreshToken = localStorage.getItem('refresh_token');
            } else {
              this.accessToken = null;
              this.refreshToken = null;
            }
          }
        
          setTokens(access, refresh) {
            this.accessToken = access;
            this.refreshToken = refresh;
            localStorage.setItem('access_token', access);
            localStorage.setItem('refresh_token', refresh);
          }
        
          clearTokens() {
            this.accessToken = null;
            this.refreshToken = null;
            localStorage.removeItem('access_token');
            localStorage.removeItem('refresh_token');
          }
        
          async request(endpoint, options = {}) {
            let url = endpoint.startsWith('http') ? endpoint : `${API_BASE}${endpoint}`;
            const headers = { 'Content-Type': 'application/json', ...options.headers };
            if (this.accessToken) headers['Authorization'] = `Bearer ${this.accessToken}`;
        
            const config = { 
                ...options, 
                headers,
                credentials: 'include' 
            };
            
            console.log(`🌐 API Request: ${options.method || 'GET'} ${url}`);
        
            try {
              let response = await fetch(url, config);
              console.log(`📡 Response status: ${response.status}`);
              
              if (response.status === 401 && this.refreshToken) {
                console.log('🔄 Token expired, refreshing...');
                const refreshSuccess = await this.refreshAccessToken();
                if (refreshSuccess) {
                  config.headers['Authorization'] = `Bearer ${this.accessToken}`;
                  response = await fetch(url, config);
                  console.log(`📡 Retry response status: ${response.status}`);
                } else {
                  console.error('❌ Token refresh failed');
                  this.clearTokens();
                  window.location.reload(); 
                  throw new Error('Session expired');
                }
              }
              if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                console.error('❌ API Error:', errorData);
                throw new Error(errorData.detail || errorData.error || `Error: ${response.status}`);
              }
              const data = await response.json();
              console.log('✅ Response data:', data);
              return data;
            } catch (error) { 
              console.error('❌ Request failed:', error);
              throw error; 
            }
          }

          async requestAudio(endpoint, options = {}) {
            let url = endpoint.startsWith('http') ? endpoint : `${API_BASE}${endpoint}`;
            const headers = { 'Content-Type': 'application/json', ...options.headers };
            if (this.accessToken) headers['Authorization'] = `Bearer ${this.accessToken}`;
        
            const config = { 
                ...options, 
                headers,
                credentials: 'include' 
            };
            
            console.log(`🎵 Audio Request: ${options.method || 'GET'} ${url}`);
        
            try {
              let response = await fetch(url, config);
              console.log(`📡 Audio Response status: ${response.status}`);
              
              if (response.status === 401 && this.refreshToken) {
                console.log('🔄 Token expired, refreshing...');
                const refreshSuccess = await this.refreshAccessToken();
                if (refreshSuccess) {
                  config.headers['Authorization'] = `Bearer ${this.accessToken}`;
                  response = await fetch(url, config);
                }
              }
              if (!response.ok) {
                throw new Error(`Audio request failed: ${response.status}`);
              }
              
              const audioBlob = await response.blob();
              const responseText = response.headers.get('X-Response-Text');
              
              return { audioBlob, responseText };
            } catch (error) { 
              console.error('❌ Audio request failed:', error);
              throw error; 
            }
          }
        
          async refreshAccessToken() {
            try {
              const response = await fetch(`${API_BASE}refresh/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ refresh: this.refreshToken }),
                credentials: 'include'
              });
              if (response.ok) {
                const data = await response.json();
                this.setTokens(data.access, this.refreshToken); 
                return true;
              }
              return false;
            } catch (e) { return false; }
          }

          async checkServerConsent() {
              try {
                  const response = await this.request('UserConsent/needs_new_consent/', {
                      method: 'POST',
                      body: JSON.stringify({}) 
                  });
                  
                  if (response && typeof response.needs_consent !== 'undefined') {
                      return response.needs_consent;
                  }
                  return true;
              } catch (error) {
                  console.error("Failed to check consent status:", error);
                  return true;
              }
          }
        }
        
        const api = new ApiClient();

        // --- Audio Manager ---
        class AudioManager {
            constructor() {
                this.currentAudio = null;
                this.isPlaying = false;
            }

            async playAudio(audioBlob) {
                // Stop current audio if playing
                this.stop();

                const audioUrl = URL.createObjectURL(audioBlob);
                this.currentAudio = new Audio(audioUrl);
                
                this.currentAudio.onplay = () => {
                    this.isPlaying = true;
                    updateAudioPlayState(true);
                };
                
                this.currentAudio.onended = () => {
                    this.isPlaying = false;
                    updateAudioPlayState(false);
                    URL.revokeObjectURL(audioUrl);
                };
                
                this.currentAudio.onerror = () => {
                    this.isPlaying = false;
                    updateAudioPlayState(false);
                    URL.revokeObjectURL(audioUrl);
                };

                try {
                    await this.currentAudio.play();
                } catch (error) {
                    console.error('Audio playback error:', error);
                    updateAudioPlayState(false);
                }
            }

            stop() {
                if (this.currentAudio) {
                    this.currentAudio.pause();
                    this.currentAudio.currentTime = 0;
                    this.isPlaying = false;
                    updateAudioPlayState(false);
                }
            }

            pause() {
                if (this.currentAudio && this.isPlaying) {
                    this.currentAudio.pause();
                    this.isPlaying = false;
                    updateAudioPlayState(false);
                }
            }

            resume() {
                if (this.currentAudio && !this.isPlaying) {
                    this.currentAudio.play();
                }
            }
        }

        const audioManager = new AudioManager();

        function updateAudioPlayState(isPlaying) {
            state.isAudioPlaying = isPlaying;

        // --- State Management ---
        const state = {
            isAuthenticated: false,
            showConsent: false,
            currentView: 'dashboard',
            sidebarCollapsed: false,
            newChatModalOpen: false,
            sessions: [],
            activeSessionId: null,
            chatMessages: [],
            isLoading: false,
            dashboardData: null,
            teamDashboardData: null,
            hasTeam: false,
            feedbackSubmitted: false,
            voiceEnabled: false,
            selectedVoice: 'RACHEL',
            isAudioPlaying: false,
            availableVoices: [],
            showVoiceSettings: false

        // --- API Functions ---
        async function handleLogin(event) {
            event.preventDefault();
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;

            try {
                const data = await api.request('login/', {
                    method: 'POST',
                    body: JSON.stringify({ username, password })
                });
                api.setTokens(data.access, data.refresh);
                state.isAuthenticated = true;
                
                const needsConsent = await api.checkServerConsent();
                if (needsConsent) {
                    state.showConsent = true;
                } else {
                    await initializeApp();
                }
                render();
            } catch (error) {
                alert(error.message);
            }
        }

        async function handleRegister(event) {
            event.preventDefault();
            const username = document.getElementById('register-username').value;
            const email = document.getElementById('register-email').value;
            const password = document.getElementById('register-password').value;

            try {
                await api.request('register/', {
                    method: 'POST',
                    body: JSON.stringify({ username, email, password })
                });
                alert('Registration successful! Please login.');
                document.getElementById('register-form').reset();
            } catch (error) {
                alert(error.message);
            }
        }

        async function handleConsentAccept() {
            try {
                await api.request('UserConsent/', {
                    method: 'POST',
                    body: JSON.stringify({ consent_version: CURRENT_CONSENT_VERSION })
                });
                state.showConsent = false;
                await initializeApp();
                render();
            } catch (error) {
                alert('Failed to save consent: ' + error.message);
            }
        }

        async function initializeApp() {
            try {
                await Promise.all([
                    loadSessions(),
                    loadDashboard(),
                    loadAvailableVoices()
                ]);
                state.voiceEnabled = localStorage.getItem('voiceEnabled') === 'true';
                state.selectedVoice = localStorage.getItem('selectedVoice') || 'RACHEL';
                render();
            } catch (error) {
                console.error('Failed to initialize app:', error);
            }
        }

        async function loadSessions() {
            try {
                const sessions = await api.request('Chats/');
                state.sessions = sessions.sort((a, b) => new Date(b.last_updated) - new Date(a.last_updated));
            } catch (error) {
                console.error('Failed to load sessions:', error);
            }
        }

        async function loadDashboard() {
            try {
                const dashboard = await api.request('UserDashboard/');
                state.dashboardData = dashboard[0] || null;
            } catch (error) {
                console.error('Failed to load dashboard:', error);
            }
        }

        async function loadAvailableVoices() {
            try {
                const response = await api.request('Voice/list_voices/');
                state.availableVoices = response.voices || [];
            } catch (error) {
                console.error('Failed to load voices:', error);
                state.availableVoices = [];
            }
        }

        async function handleCreateNewChat(event) {
            event.preventDefault();
            const title = document.getElementById('new-chat-title').value;
            const mode = document.getElementById('new-chat-mode').value;

            try {
                const newSession = await api.request('Chats/', {
                    method: 'POST',
                    body: JSON.stringify({ title, AiMode: mode })
                });
                state.sessions.unshift(newSession);
                state.activeSessionId = newSession.id;
                state.currentView = 'chat';
                state.newChatModalOpen = false;
                state.chatMessages = [];
                render();
            } catch (error) {
                alert('Failed to create chat: ' + error.message);
            }
        }

        async function handleSessionClick(sessionId) {
            state.activeSessionId = sessionId;
            state.currentView = 'chat';
            await loadChatHistory(sessionId);
            render();
        }

        async function loadChatHistory(sessionId) {
            try {
                const response = await api.request(`ChatData/?chat_id=${sessionId}`);
                if (response.length > 0) {
                    const content = response[0].content || [];
                    state.chatMessages = content.map(msg => ({
                        role: msg.role,
                        content: msg.message
                    }));
                } else {
                    state.chatMessages = [];
                }
            } catch (error) {
                console.error('Failed to load chat:', error);
                state.chatMessages = [];
            }
        }

        async function handleSendMessage(event) {
            event.preventDefault();
            const input = document.getElementById('chat-input');
            const message = input.value.trim();
            if (!message || !state.activeSessionId) return;

            state.chatMessages.push({ role: 'user', content: message });
            input.value = '';
            render();

            const session = state.sessions.find(s => s.id === state.activeSessionId);
            const mode = session?.AiMode === 'therapy' ? 'specialist' : 'counsellor';

            if (state.voiceEnabled) {
                await sendMessageWithVoice(message, mode);
            } else {
                await sendMessageText(message, mode);
            }
        }

        async function sendMessageText(message, mode) {
            try {
                state.isLoading = true;
                render();

                const response = await fetch(`${API_BASE}ChatData/continue_chat/`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${api.accessToken}`
                    },
                    body: JSON.stringify({
                        prompt: message,
                        mode: mode,
                        ChatID: state.activeSessionId
                    })
                });

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let fullResponse = '';

                state.chatMessages.push({ role: 'assistant', content: '', isStreaming: true });
                render();

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value, { stream: true });
                    fullResponse += chunk;
                    
                    state.chatMessages[state.chatMessages.length - 1].content = fullResponse;
                    render();
                }

                state.chatMessages[state.chatMessages.length - 1].isStreaming = false;
                state.isLoading = false;
                render();
            } catch (error) {
                console.error('Send message error:', error);
                state.chatMessages.push({ role: 'assistant', content: 'Error: ' + error.message });
                state.isLoading = false;
                render();
            }
        }

        async function sendMessageWithVoice(message, mode) {
            try {
                state.isLoading = true;
                render();

                const voiceId = AVAILABLE_VOICES[state.selectedVoice].id;
                const { audioBlob, responseText } = await api.requestAudio('ChatData/continue_chat_with_voice/', {
                    method: 'POST',
                    body: JSON.stringify({
                        prompt: message,
                        mode: mode,
                        ChatID: state.activeSessionId,
                        voice_id: voiceId
                    })
                });

                const aiMessage = responseText || 'Response received';
                state.chatMessages.push({ role: 'assistant', content: aiMessage });
                state.isLoading = false;
                render();

                await audioManager.playAudio(audioBlob);
            } catch (error) {
                console.error('Voice message error:', error);
                state.chatMessages.push({ role: 'assistant', content: 'Error: ' + error.message });
                state.isLoading = false;
                render();
            }
        }

        async function handleDeleteChat(sessionId) {
            if (!confirm('Delete this chat session?')) return;

            try {
                await api.request('ChatData/delete_chat/', {
                    method: 'DELETE',
                    body: JSON.stringify({ ChatID: sessionId })
                });
                state.sessions = state.sessions.filter(s => s.id !== sessionId);
                if (state.activeSessionId === sessionId) {
                    state.activeSessionId = null;
                    state.chatMessages = [];
                    state.currentView = 'dashboard';
                }
                render();
            } catch (error) {
                alert('Failed to delete chat: ' + error.message);
            }
        }

        async function handleSubmitFeedback(event) {
            event.preventDefault();
            const feedback = document.getElementById('feedback-text').value;
            const rating = parseInt(document.getElementById('feedback-rating').value);

            try {
                await api.request('UserFeedback/', {
                    method: 'POST',
                    body: JSON.stringify({ feedback, rating })
                });
                state.feedbackSubmitted = true;
                setTimeout(() => {
                    state.feedbackSubmitted = false;
                    render();
                }, 3000);
                document.getElementById('feedback-form').reset();
                render();
            } catch (error) {
                alert('Failed to submit feedback: ' + error.message);
            }
        }

        async function handleHumanHelp() {
            if (!confirm('Request human therapist assistance?')) return;
            try {
                await api.request('TherapistNeeded/', {
                    method: 'POST',
                    body: JSON.stringify({})
                });
                alert('Your request has been submitted. A human therapist will reach out soon.');
            } catch (error) {
                alert('Failed to submit request: ' + error.message);
            }
        }

        function toggleVoice() {
            state.voiceEnabled = !state.voiceEnabled;
            localStorage.setItem('voiceEnabled', state.voiceEnabled.toString());
            if (!state.voiceEnabled) {
                audioManager.stop();
            }
            render();
        }

        function toggleVoiceSettings() {
            state.showVoiceSettings = !state.showVoiceSettings;
            render();
        }

        function selectVoice(voiceKey) {
            state.selectedVoice = voiceKey;
            localStorage.setItem('selectedVoice', voiceKey);
            state.showVoiceSettings = false;
            render();
        }

        function toggleAudioPlayback() {
            if (audioManager.isPlaying) {
                audioManager.pause();
            } else {
                audioManager.resume();
            }
        }

        function handleLogout() {
            api.clearTokens();
            state.isAuthenticated = false;
            state.sessions = [];
            state.chatMessages = [];
            state.activeSessionId = null;
            render();
        }

        function navigateTo(view) {
            state.currentView = view;
            render();
        }

        function toggleSidebar() {
            state.sidebarCollapsed = !state.sidebarCollapsed;
            render();
        }

        function openNewChatModal() {
            state.newChatModalOpen = true;
            render();
        }

        function closeNewChatModal() {
            state.newChatModalOpen = false;
            render();
        }

        function renderConsentPage() {
            return `
                <div class="min-h-screen flex items-center justify-center p-4 bg-gradient-to-br from-slate-900 via-[#0f172a] to-indigo-950">
                    <div class="w-full max-w-2xl bg-[#1e293b] rounded-3xl p-8 shadow-2xl border border-slate-800">
                        <h2 class="text-2xl font-bold text-white mb-6">Privacy Policy & Terms</h2>
                        <div class="bg-slate-800 rounded-xl p-6 max-h-96 overflow-y-auto mb-6">
                            <h3 class="text-lg font-semibold text-white mb-3">Data Collection & Usage</h3>
                            <p class="text-slate-300 mb-4">We collect and process your conversations to provide AI-powered mental health support. Your data is encrypted and stored securely.</p>
                            
                            <h3 class="text-lg font-semibold text-white mb-3">Voice Features</h3>
                            <p class="text-slate-300 mb-4">When you enable voice features, your text is sent to ElevenLabs for speech synthesis. No voice recordings are stored.</p>
                            
                            <h3 class="text-lg font-semibold text-white mb-3">Your Rights</h3>
                            <p class="text-slate-300 mb-4">You can request deletion of your data at any time. Contact support for assistance.</p>
                        </div>
                        <div class="flex gap-4">
                            <button onclick="handleLogout()" class="flex-1 py-3 rounded-xl border border-slate-600 text-slate-300 hover:bg-slate-800 transition-colors">Decline</button>
                            <button onclick="handleConsentAccept()" class="flex-1 py-3 rounded-xl bg-indigo-600 text-white font-bold hover:bg-indigo-500 transition-colors">Accept & Continue</button>
                        </div>
                    </div>
                </div>
            `;
        }

        function renderDashboard() {
            const data = state.dashboardData?.content;
            
            return `
                <div class="max-w-6xl mx-auto">
                    <h1 class="text-3xl font-bold text-white mb-8">Personal Dashboard</h1>
                    
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
                        <div class="bg-[#1e293b] rounded-2xl p-6 border border-slate-800">
                            <div class="flex items-center gap-3 mb-3">
                                ${Icon({ name: 'messageSquare', size: 24, className: 'text-indigo-400' })}
                                <h3 class="text-lg font-semibold text-white">Total Sessions</h3>
                            </div>
                            <p class="text-3xl font-bold text-white">${state.sessions.length}</p>
                        </div>
                        
                        <div class="bg-[#1e293b] rounded-2xl p-6 border border-slate-800">
                            <div class="flex items-center gap-3 mb-3">
                                ${Icon({ name: 'volume2', size: 24, className: 'text-emerald-400' })}
                                <h3 class="text-lg font-semibold text-white">Voice Mode</h3>
                            </div>
                            <p class="text-3xl font-bold text-white">${state.voiceEnabled ? 'ON' : 'OFF'}</p>
                        </div>
                        
                        <div class="bg-[#1e293b] rounded-2xl p-6 border border-slate-800">
                            <div class="flex items-center gap-3 mb-3">
                                ${Icon({ name: 'thumbsUp', size: 24, className: 'text-rose-400' })}
                                <h3 class="text-lg font-semibold text-white">Active Voice</h3>
                            </div>
                            <p class="text-xl font-bold text-white">${AVAILABLE_VOICES[state.selectedVoice].name}</p>
                        </div>
                    </div>

                    ${data ? `
                        <div class="bg-[#1e293b] rounded-2xl p-6 border border-slate-800">
                            <h2 class="text-xl font-bold text-white mb-4">Insights</h2>
                            <div class="prose prose-invert max-w-none">
                                <pre class="text-slate-300 whitespace-pre-wrap">${JSON.stringify(data, null, 2)}</pre>
                            </div>
                        </div>
                    ` : `
                        <div class="bg-[#1e293b] rounded-2xl p-8 border border-slate-800 text-center">
                            <p class="text-slate-400">No dashboard data available yet. Start chatting to generate insights!</p>
                        </div>
                    `}
                </div>
            `;
        }

        function renderChat() {
            const session = state.sessions.find(s => s.id === state.activeSessionId);
            
            return `
                <div class="flex flex-col h-[calc(100vh-8rem)]">
                    <div class="flex items-center justify-between mb-6">
                        <div>
                            <h1 class="text-2xl font-bold text-white">${session?.title || 'Chat'}</h1>
                            <p class="text-sm text-slate-400">${session?.AiMode === 'therapy' ? 'Therapy Mode' : 'Counsellor Mode'}</p>
                        </div>
                        
                        <div class="flex items-center gap-2">
                            ${state.isAudioPlaying ? `
                                <button onclick="toggleAudioPlayback()" class="p-3 bg-slate-800 rounded-xl text-rose-400 hover:bg-slate-700 transition-colors">
                                    ${Icon({ name: 'pause', size: 20 })}
                                </button>
                            ` : ''}
                            
                            <div class="relative">
                                <button onclick="toggleVoiceSettings()" class="p-3 ${state.voiceEnabled ? 'bg-emerald-600' : 'bg-slate-800'} rounded-xl text-white hover:opacity-80 transition-colors">
                                    ${Icon({ name: state.voiceEnabled ? 'volume2' : 'volumeX', size: 20 })}
                                </button>
                                
                                ${state.showVoiceSettings ? `
                                    <div class="absolute right-0 top-full mt-2 w-72 bg-[#1e293b] rounded-xl border border-slate-700 shadow-xl p-4 z-50">
                                        <div class="flex items-center justify-between mb-4">
                                            <h3 class="font-semibold text-white">Voice Settings</h3>
                                            <button onclick="toggleVoiceSettings()" class="text-slate-400 hover:text-white">×</button>
                                        </div>
                                        
                                        <div class="mb-4">
                                            <label class="flex items-center gap-2 cursor-pointer">
                                                <input type="checkbox" ${state.voiceEnabled ? 'checked' : ''} onchange="toggleVoice()" class="form-checkbox rounded bg-slate-700 border-slate-600 text-indigo-600">
                                                <span class="text-sm text-slate-300">Enable Voice Responses</span>
                                            </label>
                                        </div>
                                        
                                        <div class="space-y-2">
                                            <p class="text-xs text-slate-400 mb-2">Select Voice:</p>
                                            ${Object.entries(AVAILABLE_VOICES).map(([key, voice]) => `
                                                <button onclick="selectVoice('${key}')" class="w-full text-left p-3 rounded-lg ${state.selectedVoice === key ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-300 hover:bg-slate-700'} transition-colors">
                                                    <div class="font-medium">${voice.name}</div>
                                                    <div class="text-xs opacity-75">${voice.gender}, ${voice.accent} - ${voice.description}</div>
                                                </button>
                                            `).join('')}
                                        </div>
                                    </div>
                                ` : ''}
                            </div>
                        </div>
                    </div>

                    <div class="flex-1 overflow-y-auto bg-[#1e293b] rounded-2xl p-6 mb-4 border border-slate-800">
                        ${state.chatMessages.length === 0 ? `
                            <div class="flex flex-col items-center justify-center h-full text-center">
                                <div class="mb-4">${Icon({ name: 'messageSquare', size: 48, className: 'text-slate-600' })}</div>
                                <h3 class="text-xl font-semibold text-white mb-2">Start a Conversation</h3>
                                <p class="text-slate-400 max-w-md">Share your thoughts and feelings. ${state.voiceEnabled ? 'Responses will be spoken aloud.' : 'Enable voice for spoken responses.'}</p>
                            </div>
                        ` : state.chatMessages.map((msg, idx) => `
                            <div class="mb-6 ${msg.role === 'user' ? 'text-right' : 'text-left'}">
                                <div class="inline-block max-w-[80%] p-4 rounded-2xl ${msg.role === 'user' ? 'bg-indigo-600 text-white' : 'bg-slate-800 text-slate-100'}">
                                    ${msg.content}${msg.isStreaming ? '<span class="inline-block w-2 h-4 ml-1 bg-current animate-pulse"></span>' : ''}
                                </div>
                            </div>
                        `).join('')}
                        ${state.isLoading && state.chatMessages[state.chatMessages.length - 1]?.role === 'user' ? `
                            <div class="text-left mb-6">
                                <div class="inline-block p-4 rounded-2xl bg-slate-800">
                                    <div class="flex gap-1">
                                        <div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce"></div>
                                        <div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 0.1s"></div>
                                        <div class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 0.2s"></div>
                                    </div>
                                </div>
                            </div>
                        ` : ''}
                    </div>

                    <form onsubmit="handleSendMessage(event)" class="flex gap-3">
                        <input type="text" id="chat-input" placeholder="Type your message..." class="flex-1 px-6 py-4 bg-[#1e293b] border border-slate-800 rounded-2xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500" />
                        <button type="submit" class="px-6 py-4 bg-indigo-600 rounded-2xl text-white font-bold hover:bg-indigo-500 transition-colors flex items-center gap-2">
                            ${Icon({ name: 'send', size: 20 })}
                            Send
                        </button>
                    </form>
                </div>
            `;
        }

        function renderFeedback() {
            return `
                <div class="max-w-2xl mx-auto">
                    <h1 class="text-3xl font-bold text-white mb-8">Submit Feedback</h1>
                    
                    ${state.feedbackSubmitted ? `
                        <div class="bg-emerald-900/30 border border-emerald-700 rounded-2xl p-6 mb-6">
                            <p class="text-emerald-400 text-center font-semibold">Thank you for your feedback!</p>
                        </div>
                    ` : ''}
                    
                    <form id="feedback-form" onsubmit="handleSubmitFeedback(event)" class="bg-[#1e293b] rounded-2xl p-8 border border-slate-800 space-y-6">
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">Your Feedback</label>
                            <textarea id="feedback-text" required rows="6" class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Share your experience with the AI therapist..."></textarea>
                        </div>
                        
                        <div>
                            <label class="block text-sm font-medium text-slate-300 mb-2">Rating (1-5)</label>
                            <select id="feedback-rating" class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                <option value="5">5 - Excellent</option>
                                <option value="4">4 - Good</option>
                                <option value="3">3 - Average</option>
                                <option value="2">2 - Below Average</option>
                                <option value="1">1 - Poor</option>
                            </select>
                        </div>
                        
                        <button type="submit" class="w-full py-4 rounded-xl bg-indigo-600 text-white font-bold hover:bg-indigo-500 transition-colors">Submit Feedback</button>
                    </form>
                </div>
            `;
        }

        function render() {
            const root = document.getElementById('root');

            if (!state.isAuthenticated) {
                root.innerHTML = renderAuthPage();
                return;
            }

            if (state.showConsent) {
                root.innerHTML = renderConsentPage();
                return;
            }

            let mainContent = '';
            switch (state.currentView) {
                case 'dashboard':
                    mainContent = renderDashboard();
                    break;
                case 'chat':
                    mainContent = renderChat();
                    break;
                case 'feedback':
                    mainContent = renderFeedback();
                    break;
                default:
                    mainContent = renderDashboard();
            }

            root.innerHTML = `
                <div class="flex h-screen">
                    <aside class="${state.sidebarCollapsed ? 'w-20' : 'w-64'} bg-[#1e293b] border-r border-slate-800 flex flex-col p-4 transition-all duration-300">
                        <div class="flex items-center justify-between mb-8">
                            ${!state.sidebarCollapsed ? '<h1 class="text-xl font-bold text-white">AI Psychologist</h1>' : ''}
                            <button onclick="toggleSidebar()" class="p-2 hover:bg-slate-800 rounded-lg transition-colors">
                                ${Icon({ name: 'menu', size: 20, className: 'text-slate-400' })}
                            </button>
                        </div>

                        <div class="space-y-2">
                            <button onclick="navigateTo('dashboard')" class="w-full h-10 rounded-md flex items-center px-3 ${state.currentView === 'dashboard' ? 'bg-slate-800 text-indigo-400' : 'text-slate-400 hover:bg-slate-800 hover:text-indigo-400'} transition-colors">
                                ${Icon({ name: 'dashboard', size: 20 })}
                                ${!state.sidebarCollapsed ? '<span class="ml-3 text-sm font-medium">Dashboard</span>' : ''}
                            </button>

                            <button onclick="openNewChatModal()" class="w-full h-10 rounded-md flex items-center px-3 ${state.currentView === 'chat' ? 'bg-slate-800 text-indigo-400' : 'text-slate-400 hover:bg-slate-800 hover:text-indigo-400'} transition-colors">
                                ${Icon({ name: 'messageSquare', size: 20 })}
                                ${!state.sidebarCollapsed ? '<span class="ml-3 text-sm font-medium">New Chat</span>' : ''}
                            </button>

                            <button onclick="navigateTo('feedback')" class="w-full h-10 rounded-md flex items-center px-3 ${state.currentView === 'feedback' ? 'bg-slate-800 text-indigo-400' : 'text-slate-400 hover:bg-slate-800 hover:text-indigo-400'} transition-colors">
                                ${Icon({ name: 'thumbsUp', size: 20 })}
                                ${!state.sidebarCollapsed ? '<span class="ml-3 text-sm font-medium">Feedback</span>' : ''}
                            </button>
                        </div>

                        ${!state.sidebarCollapsed ? `
                            <div class="mt-6 flex-1 overflow-y-auto">
                                <h3 class="px-3 text-xs font-bold text-slate-500 uppercase mb-2">Recent Sessions</h3>
                                <div class="space-y-1">
                                    ${state.sessions.map(session => {
                                        const date = new Date(session.last_updated);
                                        const dateStr = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                                        return `
                                        <div class="flex items-center gap-1">
                                            <button onclick="handleSessionClick('${session.id}')" class="flex-1 rounded-md px-3 py-2 ${state.activeSessionId === session.id ? 'bg-slate-800 text-indigo-400' : 'text-slate-400 hover:bg-slate-800'} transition-colors text-left">
                                                <div class="flex items-center gap-2 mb-1">
                                                    ${Icon({ name: 'messageSquare', size: 16 })}
                                                    <span class="text-xs truncate flex-1">${session.title}</span>
                                                </div>
                                                <div class="flex items-center gap-2 ml-5">
                                                    <span class="text-[10px] text-slate-600">${dateStr}</span>
                                                </div>
                                            </button>
                                            <button onclick="handleDeleteChat('${session.id}')" class="p-2 text-slate-600 hover:text-red-400 rounded transition-colors">
                                                ${Icon({ name: 'trash', size: 16 })}
                                            </button>
                                        </div>
                                    `}).join('')}
                                    ${state.sessions.length === 0 ? '<p class="px-3 text-xs text-slate-600 italic">No sessions</p>' : ''}
                                </div>
                            </div>
                        ` : ''}

                        <div class="mt-auto border-t border-slate-800 pt-4 space-y-2">
                            <button onclick="handleHumanHelp()" class="w-full h-10 rounded-md flex items-center px-3 text-slate-400 hover:bg-slate-800 hover:text-rose-400 transition-colors">
                                ${Icon({ name: 'user', size: 20 })}
                                ${!state.sidebarCollapsed ? '<span class="ml-3 text-sm font-medium">Human Help</span>' : ''}
                            </button>
                            <button onclick="handleLogout()" class="w-full h-10 rounded-md flex items-center px-3 text-slate-400 hover:bg-slate-800 hover:text-red-400 transition-colors">
                                ${Icon({ name: 'logOut', size: 20 })}
                                ${!state.sidebarCollapsed ? '<span class="ml-3 text-sm font-medium">Logout</span>' : ''}
                            </button>
                        </div>
                    </aside>

                    <main class="flex-1 p-8 overflow-y-auto">
                        ${mainContent}
                    </main>
                </div>

                ${state.newChatModalOpen ? `
                    <div class="fixed inset-0 bg-black/70 backdrop-blur-sm flex items-center justify-center z-50">
                        <div class="bg-[#1e293b] rounded-2xl p-8 w-full max-w-md border border-slate-700">
                            <h2 class="text-2xl font-bold text-white mb-6">Start New Session</h2>
                            <form onsubmit="handleCreateNewChat(event)" class="space-y-6">
                                <div>
                                    <label class="block text-sm font-medium text-slate-300 mb-2">Session Name</label>
                                    <input type="text" id="new-chat-title" required class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-white placeholder-slate-500 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="e.g. Anxiety check-in..." />
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-slate-300 mb-2">Select Mode</label>
                                    <select id="new-chat-mode" class="w-full px-4 py-3 bg-slate-800 border border-slate-700 rounded-xl text-white focus:outline-none focus:ring-2 focus:ring-indigo-500">
                                        <option value="therapy">Therapy AI</option>
                                        <option value="counsellor">Counsellor AI</option>
                                    </select>
                                </div>
                                <div class="flex gap-3">
                                    <button type="button" onclick="closeNewChatModal()" class="flex-1 py-3 rounded-xl border border-slate-600 text-slate-300 hover:bg-slate-800 transition-colors">Cancel</button>
                                    <button type="submit" class="flex-1 py-3 rounded-xl bg-indigo-600 text-white font-bold hover:bg-indigo-500 transition-colors">Start Chat</button>
                                </div>
                            </form>
                        </div>
                    </div>
                ` : ''}
            `;
        }

        // --- Initialize on load ---
        window.addEventListener('DOMContentLoaded', async () => {
            console.log('🌐 DOM Content Loaded');
            console.log('🔍 Checking for existing tokens...');
            
            if (localStorage.getItem('access_token')) {
                console.log('✅ Tokens found');
                state.isAuthenticated = true;
                
                try {
                    const needsConsent = await api.checkServerConsent();
                    
                    if (needsConsent) {
                        console.log('⚠️ Server says consent needed');
                        state.showConsent = true;
                        render();
                    } else {
                        console.log('✅ Server says consent valid, initializing app...');
                        await initializeApp();
                    }
                } catch (e) {
                    console.log('❌ Session invalid or check failed');
                    handleLogout();
                }
            } else {
                console.log('ℹ️ No tokens found, showing login');
                render();
            }
        });
    </script>
</body>
</html>
