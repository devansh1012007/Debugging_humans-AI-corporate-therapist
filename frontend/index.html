// ─── API Client ───────────────────────────────────────────────────────────
class ApiClient {
    constructor() {
        if (typeof window !== 'undefined') {
            this.accessToken = localStorage.getItem('access_token');
            this.refreshToken = localStorage.getItem('refresh_token');
        } else {
            this.accessToken = null;
            this.refreshToken = null;
        }
    }

    setTokens(access, refresh) {
        this.accessToken = access;
        this.refreshToken = refresh;
        localStorage.setItem('access_token', access);
        localStorage.setItem('refresh_token', refresh);
    }

    clearTokens() {
        this.accessToken = null;
        this.refreshToken = null;
        localStorage.removeItem('access_token');
        localStorage.removeItem('refresh_token');
    }

    async request(endpoint, options = {}) {
        let url = endpoint.startsWith('http') ? endpoint : `${API_BASE}${endpoint}`;
        const headers = { 'Content-Type': 'application/json', ...options.headers };
        if (this.accessToken) headers['Authorization'] = `Bearer ${this.accessToken}`;

        const config = { ...options, headers, credentials: 'include' };
        console.log(`🌐 API Request: ${options.method || 'GET'} ${url}`);

        try {
            let response = await fetch(url, config);
            console.log(`📡 Response status: ${response.status}`);
            
            if (response.status === 401 && this.refreshToken) {
                console.log('🔄 Token expired, refreshing...');
                const refreshSuccess = await this.refreshAccessToken();
                if (refreshSuccess) {
                    config.headers['Authorization'] = `Bearer ${this.accessToken}`;
                    response = await fetch(url, config);
                } else {
                    this.clearTokens();
                    window.location.reload();
                    throw new Error('Session expired');
                }
            }
            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                throw new Error(errorData.detail || errorData.error || `Error: ${response.status}`);
            }
            const data = await response.json();
            return data;
        } catch (error) { 
            console.error('❌ Request failed:', error);
            throw error; 
        }
    }

    async refreshAccessToken() {
        try {
            const response = await fetch(`${API_BASE}/refresh/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ refresh: this.refreshToken }),
                credentials: 'include'
            });
            if (response.ok) {
                const data = await response.json();
                this.setTokens(data.access, this.refreshToken);
                return true;
            }
            return false;
        } catch (e) { return false; }
    }

    async checkServerConsent() {
        try {
            const response = await this.request('/UserConsent/needs_new_consent/', {
                method: 'GET',
                // 1. REMOVED the 'body' property here
            
                // 2. ADDED credentials so the browser actually sends the cookie to Django
                credentials: 'include' 
            });

            if (response && typeof response.needs_consent !== 'undefined') {
                return response.needs_consent;
            }
            return true;
        } catch (error) {
            // Adding a quick log here is helpful for debugging why it might be failing
            console.error("Failed to check server consent:", error);
            return true;
        }
    }
}

// ─── Markdown Formatter ──────────────────────────────────────────────────
function formatAIResponse(text) {
    if (!text) return '';

    // 1. Escape HTML to prevent XSS issues
    let html = text.replace(/</g, "&lt;").replace(/>/g, "&gt;");

    // 2. Code blocks: ```code```
    html = html.replace(/```([\s\S]*?)```/g, '<pre class="bg-slate-900/80 p-3 rounded-lg overflow-x-auto my-3 border border-slate-700 font-mono text-sm text-slate-300"><code>$1</code></pre>');

    // 3. Inline code: `code`
    html = html.replace(/`([^`]+)`/g, '<code class="bg-slate-800 text-indigo-300 px-1.5 py-0.5 rounded-md font-mono text-sm">$1</code>');

    // 4. Bold: **text**
    html = html.replace(/\*\*(.*?)\*\*/g, '<strong class="font-bold text-white">$1</strong>');

    // 5. Italic: *text*
    html = html.replace(/\*(.*?)\*/g, '<em class="italic text-slate-300">$1</em>');

    // 6. Lists: bullet points starting with * or -
    html = html.replace(/^(?:\*|\-)\s+(.*)$/gm, '<li class="ml-4 list-disc marker:text-indigo-500">$1</li>');

    return html;
}

// ─── PSYCHO REPORT TAB helpers ────────────────────────────────────────────
function getSeverityClass(level) {
    if (!level) return 'severity-low';
    const l = level.toLowerCase();
    if (l.includes('very severe')) return 'severity-very-severe';
    if (l.includes('severe')) return 'severity-severe';
    if (l.includes('moderate')) return 'severity-moderate';
    if (l.includes('mild')) return 'severity-mild';
    if (l.includes('high')) return 'severity-high';
    if (l.includes('low')) return 'severity-low';
    if (l.includes('average')) return 'severity-average';
    if (l.includes('risk')) return 'severity-risk';
    if (l.includes('none') || l.includes('minimal')) return 'severity-none';
    return 'severity-low';
}

function getScoreColor(pct) {
    if (pct >= 75) return '#ef4444';
    if (pct >= 50) return '#f97316';
    if (pct >= 30) return '#f59e0b';
    return '#10b981';
}

function getBurnoutColor(level) {
    const l = (level || '').toLowerCase();
    if (l === 'high') return '#ef4444';
    if (l === 'moderate') return '#f97316';
    return '#10b981';
}

function getPersonalityColor(level) {
    const l = (level || '').toLowerCase();
    if (l === 'high') return '#6366f1';
    if (l === 'average') return '#f59e0b';
    return '#64748b';
}

function renderBigFive(big_five) {
    if (!big_five) return '<p class="text-slate-500 text-sm">No Big Five data available.</p>';
    const factors = Object.entries(big_five);
    return `
        <div class="space-y-5">
            ${factors.map(([name, info]) => {
                const pct = ((info.raw_score / info.max_possible) * 100).toFixed(0);
                const color = getPersonalityColor(info.level);
                return `
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <div>
                            <span class="text-sm font-semibold text-slate-200">${name}</span>
                            <span class="ml-2 severity-badge ${getSeverityClass(info.level)}">${info.level}</span>
                        </div>
                        <span class="text-sm font-bold" style="color:${color}">${info.raw_score.toFixed(2)} / ${info.max_possible}</span>
                    </div>
                    <div class="progress-bar-track">
                        <div class="progress-bar-fill" style="width:${pct}%; background:${color};"></div>
                    </div>
                    <p class="text-xs text-slate-500 mt-1.5">${info.interpretation}</p>
                </div>`;
            }).join('')}
        </div>
    `;
}

function renderBurnout(burnout) {
    if (!burnout) return '<p class="text-slate-500 text-sm">No burnout data available.</p>';
    const subscales = ['Emotional Exhaustion', 'Depersonalization', 'Personal Accomplishment'];
    const ob = (burnout.overall_burnout || '').toLowerCase();
    const overallClass = ob.includes('present') || ob.includes('active')
        ? 'severity-severe'
        : ob.includes('risk') || ob.includes('partial')
        ? 'severity-moderate'
        : 'severity-none';

    return `
        <div class="mb-4 p-3 rounded-xl bg-slate-900/50 border border-slate-700/40 flex items-center justify-between">
            <span class="text-sm font-semibold text-slate-300">Overall Status</span>
            <span class="severity-badge ${overallClass}">${burnout.overall_burnout || 'Unknown'}</span>
        </div>
        <div class="space-y-4">
            ${subscales.map(sub => {
                const info = burnout[sub];
                if (!info) return '';
                const pct = ((info.score / info.max_possible) * 100).toFixed(0);
                const color = getBurnoutColor(info.level);
                return `
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <div>
                            <span class="text-sm font-semibold text-slate-200">${sub}</span>
                            <span class="ml-2 severity-badge ${getSeverityClass(info.level)}">${info.level}</span>
                        </div>
                        <span class="text-sm font-bold" style="color:${color}">${info.score} / ${info.max_possible}</span>
                    </div>
                    <div class="progress-bar-track">
                        <div class="progress-bar-fill" style="width:${pct}%; background:${color};"></div>
                    </div>
                    <p class="text-xs text-slate-500 mt-1">${info.interpretation}</p>
                </div>`;
            }).join('')}
        </div>
    `;
}

                    <div class="flex items-center gap-3 mb-5 pb-4 border-b border-slate-700/40">

                    </div>
                    <div class="overflow-y-auto max-h-96">${renderAnxiety(content.anxiety)}</div>
                </div>
            </div>

            ${(content.stress || content.resilience) ? `
            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                ${content.stress ? `
                <div class="glass-card rounded-3xl p-6">
                    <div class="flex items-center gap-3 mb-5 pb-4 border-b border-slate-700/40">
                        <div class="p-2 bg-yellow-500/10 rounded-xl text-yellow-400">${Icon({ name: 'alertCircle', size: 20 })}</div>
                        <h3 class="text-lg font-bold text-white">Stress Assessment</h3>
                    </div>
                    <div class="overflow-y-auto max-h-96">${renderStress(content.stress)}</div>
                </div>` : ''}
                ${content.resilience ? `
                <div class="glass-card rounded-3xl p-6">
                    <div class="flex items-center gap-3 mb-5 pb-4 border-b border-slate-700/40">
                        <div class="p-2 bg-emerald-500/10 rounded-xl text-emerald-400">${Icon({ name: 'thumbsUp', size: 20 })}</div>
                        <h3 class="text-lg font-bold text-white">Resilience Assessment</h3>
                    </div>
                    <div class="overflow-y-auto max-h-96">${renderResilience(content.resilience)}</div>
                </div>` : ''}

}

// ─── History charts ───────────────────────────────────────────────────────
function renderHistorySection(historyData) {
    const entries = (historyData && historyData.content) ? historyData.content : [];
    
    if (!entries || entries.length === 0) {
        return `
            <div class="glass-card rounded-3xl p-16 text-center border-dashed border-2 border-slate-700/50">
                <div class="w-20 h-20 bg-slate-800/50 rounded-full flex items-center justify-center mx-auto mb-6">
                    ${Icon({ name: 'trendingUp', size: 40, className: 'text-slate-500' })}
                </div>
                <h2 class="text-2xl font-bold text-slate-200 mb-3">No Historical Data</h2>
                <p class="text-slate-400 max-w-md mx-auto">Historical trends will appear here after multiple assessment sessions.</p>
            </div>
        `;
    }

    function unwrapEntry(e) {
        if (e && e.content && typeof e.content === 'object' && !Array.isArray(e.content)) return e.content;
        return e;
    }

    const labels = entries.map((e, i) => e.date ? e.date : `Session ${i + 1}`);

    const depressionScores = entries.map(e => unwrapEntry(e).depression?.total_score ?? null);
    const anxietyScores    = entries.map(e => unwrapEntry(e).anxiety?.total_score ?? null);
    const stressScores     = entries.map(e => unwrapEntry(e).stress?.total_score ?? null);
    const resilienceScores = entries.map(e => unwrapEntry(e).resilience?.total_score ?? null);
    const eeScores = entries.map(e => unwrapEntry(e).burnout?.['Emotional Exhaustion']?.score ?? null);
    const dpScores = entries.map(e => unwrapEntry(e).burnout?.['Depersonalization']?.score ?? null);
    const paScores = entries.map(e => unwrapEntry(e).burnout?.['Personal Accomplishment']?.score ?? null);

    const big5Factors = ['Neuroticism', 'Extraversion', 'Openness to Experience', 'Agreeableness', 'Conscientiousness'];
    const big5Colors = ['#f87171', '#60a5fa', '#34d399', '#fbbf24', '#a78bfa'];
    const big5Datasets = big5Factors.map((factor, idx) => ({
        label: factor,
        data: entries.map(e => unwrapEntry(e).big_five?.[factor]?.raw_score ?? null),
        borderColor: big5Colors[idx],
        backgroundColor: big5Colors[idx] + '20',
        tension: 0.4,
        fill: false,
        pointBackgroundColor: big5Colors[idx],
        pointRadius: 4,
        pointHoverRadius: 6,
    }));

    const anxietyPsychic = entries.map(e => unwrapEntry(e).anxiety?.psychic_subscale_score ?? null);
    const anxietySomatic = entries.map(e => unwrapEntry(e).anxiety?.somatic_subscale_score ?? null);

    const hasStressData     = stressScores.some(v => v !== null);
    const hasResilienceData = resilienceScores.some(v => v !== null);
    const lastEntry = entries[entries.length - 1];
    const lastContent = unwrapEntry(lastEntry);

    setTimeout(() => {
        const chartDefaults = {
            responsive: true,
            maintainAspectRatio: false,
            animation: { duration: 800, easing: 'easeInOutQuart' },
            plugins: {
                legend: {
                    labels: {
                        color: '#94a3b8',
                        font: { family: 'Inter', size: 11, weight: '600' },
                        boxWidth: 10,
                        padding: 12,
                    }
                },
                tooltip: {
                    backgroundColor: 'rgba(15,23,42,0.95)',
                    borderColor: 'rgba(99,102,241,0.4)',
                    borderWidth: 1,
                    titleColor: '#e2e8f0',
                    bodyColor: '#94a3b8',
                    padding: 10,
                    cornerRadius: 10,
                }
            },
            scales: {
                x: {
                    ticks: { color: '#64748b', font: { family: 'Inter', size: 11 } },
                    grid: { color: 'rgba(255,255,255,0.04)' }
                },
                y: {
                    ticks: { color: '#64748b', font: { family: 'Inter', size: 11 } },
                    grid: { color: 'rgba(255,255,255,0.04)' }
                }
            }
        };

        const ctx1 = document.getElementById('chart-dep-anx');
        if (ctx1) {
            destroyChart('chart-dep-anx');
            chartRegistry['chart-dep-anx'] = new Chart(ctx1, {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        { label: 'Depression (HAM-D)', data: depressionScores, borderColor: '#a855f7', backgroundColor: '#a855f720', tension: 0.4, fill: true, pointBackgroundColor: '#a855f7', pointRadius: 4, pointHoverRadius: 6 },
                        { label: 'Anxiety (HAM-A)', data: anxietyScores, borderColor: '#06b6d4', backgroundColor: '#06b6d420', tension: 0.4, fill: true, pointBackgroundColor: '#06b6d4', pointRadius: 4, pointHoverRadius: 6 },
                    ]
                },
                options: { ...chartDefaults, scales: { ...chartDefaults.scales, y: { ...chartDefaults.scales.y, min: 0 } } }
            });
        }

        const ctx2 = document.getElementById('chart-burnout');
        if (ctx2) {
            destroyChart('chart-burnout');
            chartRegistry['chart-burnout'] = new Chart(ctx2, {
                type: 'line',
                data: {
                    labels,
                    datasets: [
                        { label: 'Emotional Exhaustion', data: eeScores, borderColor: '#f97316', backgroundColor: '#f9731620', tension: 0.4, fill: false, pointBackgroundColor: '#f97316', pointRadius: 4, pointHoverRadius: 6 },
                        { label: 'Depersonalization', data: dpScores, borderColor: '#ef4444', backgroundColor: '#ef444420', tension: 0.4, fill: false, pointBackgroundColor: '#ef4444', pointRadius: 4, pointHoverRadius: 6 },
                        { label: 'Personal Accomplishment', data: paScores, borderColor: '#10b981', backgroundColor: '#10b98120', tension: 0.4, fill: false, pointBackgroundColor: '#10b981', pointRadius: 4, pointHoverRadius: 6 },
                    ]
                },
                options: { ...chartDefaults, scales: { ...chartDefaults.scales, y: { ...chartDefaults.scales.y, min: 0 } } }
            });
        }

        const lastBig5 = lastContent.big_five;
        const ctx3 = document.getElementById('chart-big5-radar');
        if (ctx3 && lastBig5) {
            destroyChart('chart-big5-radar');
            chartRegistry['chart-big5-radar'] = new Chart(ctx3, {
                type: 'radar',
                data: {
                    labels: big5Factors.map(f => f.replace(' to Experience', '')),
                    datasets: [{
                        label: 'Latest Session',
                        data: big5Factors.map(f => lastBig5[f]?.raw_score ?? 0),
                        borderColor: '#6366f1',
                        backgroundColor: 'rgba(99,102,241,0.15)',
                        pointBackgroundColor: '#6366f1',
                        pointRadius: 4,
                        pointHoverRadius: 6,
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: { duration: 800 },
                    scales: {
                        r: {
                            min: 0, max: 5,
                            ticks: { color: '#64748b', backdropColor: 'transparent', stepSize: 1, font: { size: 10 } },
                            grid: { color: 'rgba(255,255,255,0.06)' },
                            angleLines: { color: 'rgba(255,255,255,0.06)' },
                            pointLabels: { color: '#94a3b8', font: { family: 'Inter', size: 11, weight: '600' } }
                        }
                    },
                    plugins: { legend: { display: false } }
                }
            });
        }

        const ctx4 = document.getElementById('chart-big5-trend');
        if (ctx4) {
            destroyChart('chart-big5-trend');
            chartRegistry['chart-big5-trend'] = new Chart(ctx4, {
                type: 'line',
                data: { labels, datasets: big5Datasets },
                options: {
                    ...chartDefaults,
                    scales: {
                        ...chartDefaults.scales,
                        y: { ...chartDefaults.scales.y, min: 0, max: 5 }
                    }
                }
            });
        }

        const ctx5 = document.getElementById('chart-anx-sub');
        if (ctx5) {
            destroyChart('chart-anx-sub');
            chartRegistry['chart-anx-sub'] = new Chart(ctx5, {
                type: 'bar',
                data: {
                    labels,
                    datasets: [
                        { label: 'Psychic Anxiety', data: anxietyPsychic, backgroundColor: 'rgba(99,102,241,0.6)', borderColor: '#6366f1', borderWidth: 1.5, borderRadius: 6 },
                        { label: 'Somatic Anxiety', data: anxietySomatic, backgroundColor: 'rgba(168,85,247,0.6)', borderColor: '#a855f7', borderWidth: 1.5, borderRadius: 6 },
                    ]
                },
                options: {
                    ...chartDefaults,
                    scales: { ...chartDefaults.scales, y: { ...chartDefaults.scales.y, stacked: false, min: 0 } }
                }
            });
        }

        const latestDep = lastContent.depression;
        const ctx6 = document.getElementById('chart-dep-donut');
        if (ctx6 && latestDep) {
            destroyChart('chart-dep-donut');
            const used = latestDep.total_score;
            const remaining = latestDep.max_possible - used;
            chartRegistry['chart-dep-donut'] = new Chart(ctx6, {
                type: 'doughnut',
                data: {
                    labels: ['Score', 'Remaining'],
                    datasets: [{
                        data: [used, remaining],
                        backgroundColor: [getScoreColor((used / latestDep.max_possible) * 100), 'rgba(255,255,255,0.05)'],
                        borderColor: ['transparent', 'transparent'],
                        cutout: '78%',
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false },
                        tooltip: { callbacks: { label: ctx => ctx.label === 'Score' ? ` Score: ${used}/${latestDep.max_possible}` : '' } }
                    }
                }
            });
        }

        const ctx7 = document.getElementById('chart-stress-resilience');
        if (ctx7 && (hasStressData || hasResilienceData)) {
            destroyChart('chart-stress-resilience');
            const srDatasets = [];
            if (hasStressData) {
                srDatasets.push({ label: 'Stress', data: stressScores, borderColor: '#f97316', backgroundColor: '#f9731620', tension: 0.4, fill: true, pointBackgroundColor: '#f97316', pointRadius: 4, pointHoverRadius: 6 });
            }
            if (hasResilienceData) {
                srDatasets.push({ label: 'Resilience', data: resilienceScores, borderColor: '#10b981', backgroundColor: '#10b98120', tension: 0.4, fill: true, pointBackgroundColor: '#10b981', pointRadius: 4, pointHoverRadius: 6 });
            }
            chartRegistry['chart-stress-resilience'] = new Chart(ctx7, {
                type: 'line',
                data: { labels, datasets: srDatasets },
                options: { ...chartDefaults, scales: { ...chartDefaults.scales, y: { ...chartDefaults.scales.y, min: 0 } } }
            });
        }

    }, 100);

    return `
        <div class="space-y-6 animate-fade-in">
            <div class="glass-card rounded-3xl p-6 border border-slate-700/40">
                <div class="flex items-center gap-3 mb-1">
                    ${Icon({ name: 'trendingUp', size: 22, className: 'text-indigo-400' })}
                    <h2 class="text-xl font-bold text-white">Historical Trends</h2>
                </div>
                <p class="text-slate-400 text-sm ml-9">${entries.length} assessment session${entries.length !== 1 ? 's' : ''} recorded${entries.length > 1 && entries[0].date ? ` &nbsp;·&nbsp; ${entries[0].date} → ${entries[entries.length-1].date}` : ''}</p>
            </div>

            <div class="glass-card rounded-3xl p-6">
                <h3 class="text-base font-bold text-white mb-4">Depression & Anxiety Scores Over Time</h3>
                <div class="chart-wrapper">
                    <canvas id="chart-dep-anx"></canvas>
                </div>
            </div>

            <div class="glass-card rounded-3xl p-6">
                <h3 class="text-base font-bold text-white mb-4">Burnout Subscales Over Time</h3>
                <div class="chart-wrapper">
                    <canvas id="chart-burnout"></canvas>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="glass-card rounded-3xl p-6">
                    <h3 class="text-base font-bold text-white mb-4">Big Five Profile (Latest)</h3>
                    <div class="chart-wrapper">
                        <canvas id="chart-big5-radar"></canvas>
                    </div>
                </div>
                <div class="glass-card rounded-3xl p-6">
                    <h3 class="text-base font-bold text-white mb-4">Big Five Trends Over Time</h3>
                    <div class="chart-wrapper">
                        <canvas id="chart-big5-trend"></canvas>
                    </div>
                </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
                <div class="glass-card rounded-3xl p-6">
                    <h3 class="text-base font-bold text-white mb-4">Anxiety: Psychic vs. Somatic</h3>
                    <div class="chart-wrapper">
                        <canvas id="chart-anx-sub"></canvas>
                    </div>
                </div>
                <div class="glass-card rounded-3xl p-6 flex flex-col items-center justify-center">
                    <h3 class="text-base font-bold text-white mb-4 self-start">Latest Depression Score</h3>
                    <div class="relative" style="width:180px;height:180px;">
                        <canvas id="chart-dep-donut"></canvas>
                        <div class="absolute inset-0 flex flex-col items-center justify-center pointer-events-none">
                            <div class="text-3xl font-bold text-white">${lastContent.depression ? lastContent.depression.total_score : '—'}</div>
                            <div class="text-xs text-slate-500">HAM-D Score</div>
                        </div>
                    </div>
                    ${lastContent.depression ? `
                    <div class="mt-4 text-center">
                        <span class="severity-badge ${getSeverityClass(lastContent.depression.severity)}">
                            ${lastContent.depression.severity}
                        </span>
                    </div>` : ''}
                </div>
            </div>

            ${hasStressData || hasResilienceData ? `
            <div class="glass-card rounded-3xl p-6">
                <h3 class="text-base font-bold text-white mb-4">Stress & Resilience Over Time</h3>
                <div class="chart-wrapper">
                    <canvas id="chart-stress-resilience"></canvas>
                </div>
            </div>` : ''}
        </div>
    `;
}

async function handleConsent() {
    try {
        await api.request('/UserConsent/', {
            method: 'POST',
            body: JSON.stringify({ consent_version: CURRENT_CONSENT_VERSION })
        });
        state.showConsent = false;
        await initializeApp();
    } catch (error) {
        console.error('Consent error:', error);
        alert('Error submitting consent. Please try again.');
    }
}

async function handleLogin(event) {
    event.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('login-error');
    try {
        const data = await api.request('/login/', {
            method: 'POST',
            body: JSON.stringify({ username, password })
        });
        if (data.access && data.refresh) {
            api.setTokens(data.access, data.refresh);
            state.isAuthenticated = true;
            const needsConsent = await api.checkServerConsent();
            if (needsConsent) { state.showConsent = true; render(); }
            else { await initializeApp(); }
        } else { throw new Error('Invalid response from server'); }
    } catch (error) {
        errorDiv.textContent = 'Invalid credentials or server error';
        errorDiv.classList.remove('hidden');
    }
}

async function handleRegister(event) {
    event.preventDefault();
    const username = document.getElementById('reg-username').value;
    const email = document.getElementById('reg-email').value;
    const password = document.getElementById('reg-password').value;
    const errorDiv = document.getElementById('register-error');
    try {

function switchToRegister() { state.currentView = 'register'; render(); }
function switchToLogin() { state.currentView = 'login'; render(); }

async function initializeApp() {
    try {
        // 1. Check for server consent first
        const needsConsent = await api.checkServerConsent();
        if (needsConsent) {
            state.showConsent = true;
            render();
            return; // Exit the function to wait for user consent
        }

        // 2. If consent is NOT needed (or already given), load the dashboard data
        const drillDownData = await api.request('/UserDrillDown/');
        if (drillDownData && drillDownData.length > 0) {
            state.drillDownList = drillDownData[0].content || [];
            state.hasTeam = state.drillDownList.length > 0 && state.drillDownList[0].has_team;
        }

        const sessions = await api.request('/Chats/');
        state.sessions = Array.isArray(sessions) ? sessions.sort((a, b) => new Date(b.last_updated) - new Date(a.last_updated)) : [];

        const dashboardArr = await api.request('/UserDashboard/');
        if (dashboardArr && dashboardArr.length > 0) { state.dashboardData = dashboardArr[0]; }

        // Fetch psycho data eagerly
        await fetchPsychoData();

        state.currentView = 'dashboard';
        render();
    } catch (error) {
        console.error('Initialization error:', error);
        state.currentView = 'dashboard';
        render();
    }
}

async function fetchPsychoData() {
    try {
        const [psychoRes, historyRes] = await Promise.allSettled([
            api.request('/UserPsycoProcessedData/'),
            api.request('/UserPsycoProcessedDataHistory/')
        ]);

        if (psychoRes.status === 'fulfilled') {
            const raw = psychoRes.value;
            // Backend returns an array: [{content: {...}}, ...]
            // Unwrap to always give renderCurrentDataSection a plain {content:{...}} or the content object itself
            if (Array.isArray(raw) && raw.length > 0) {
                // raw[0] is {content: {...}} — pass it as-is; renderCurrentDataSection handles both shapes
                state.psychoData = raw[0];
            } else {
                state.psychoData = raw;
            }
            console.log('✅ psychoData set to:', state.psychoData);
        }

        if (historyRes.status === 'fulfilled') {
            const raw = historyRes.value;
            // Real backend shape: [{content:{content:[{date,content:{...}},...]}}]
            // Drill through all nesting to find the entries array.
            let entries = null;
            if (Array.isArray(raw) && raw.length > 0) {
                const first = raw[0];
                if (first.content && first.content.content && Array.isArray(first.content.content)) {
                    entries = first.content.content; // actual shape
                } else if (first.content && Array.isArray(first.content)) {
                    entries = first.content;
                } else if (first.date !== undefined || first.big_five || first.depression) {
                    entries = raw; // already flat
                } else {
                    entries = raw;
                }
            } else if (raw && raw.content) {
                if (Array.isArray(raw.content)) {
                    entries = raw.content;
                } else if (raw.content.content && Array.isArray(raw.content.content)) {
                    entries = raw.content.content;
                }
            }
            state.historyData = { content: entries || [] };
            console.log('✅ historyData entries:', (entries || []).length, state.historyData);
        }
    } catch (err) {
        console.warn('Could not load psycho data:', err);
    }
}

async function loadChatHistory(sessionId) {

async function handleSendMessage(event) {
    event.preventDefault();
    const input = document.getElementById('chat-input');
    const message = input.value.trim();
    if (!message) return;

    if (!state.activeSessionId) {
        try {
            const newSession = await api.request('/Chats/', {
                method: 'POST',
                body: JSON.stringify({ title: message.substring(0, 30) + '...', AiMode: 'therapy' })
            });
            state.activeSessionId = newSession.id;
            const sessions = await api.request('/Chats/');
            state.sessions = sessions.sort((a, b) => new Date(b.last_updated) - new Date(a.last_updated));
        } catch (error) { return; }
    }

    // Identify the active session and extract its specific AiMode
    const activeSession = state.sessions.find(s => s.id === state.activeSessionId);
    const currentMode = activeSession?.AiMode || 'therapy';

    state.messages.push({ role: 'user', content: message });
    input.value = '';
    render();

    try {
        const response = await fetch(`${API_BASE}/ChatData/continue_chat/`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${api.accessToken}` },
            body: JSON.stringify({ prompt: message, mode: currentMode, ChatID: state.activeSessionId })
        });

        if (!response.ok) throw new Error(`Server Error: ${response.statusText}`);
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let aiResponse = '';
        const streamingDiv = document.getElementById('streaming-message');
        
        streamingDiv.innerHTML = `
            <div class="flex justify-start animate-fade-in">
                <div class="bg-[#1e293b] text-slate-200 rounded-2xl rounded-bl-none px-5 py-3 max-w-[85%] text-[15px] shadow-sm">
                    <div class="whitespace-pre-wrap leading-relaxed inline-block" id="ai-response"></div>
                    <span class="inline-block w-1.5 h-4 ml-1 align-middle bg-indigo-500 animate-pulse rounded-sm"></span>
                </div>
            </div>
        `;

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            const chunk = decoder.decode(value);
            aiResponse += chunk;
            document.getElementById('ai-response').innerHTML = formatAIResponse(aiResponse);
            const chatMessages = document.getElementById('chat-messages');
            if (chatMessages) chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        state.messages.push({ role: 'assistant', content: aiResponse });
        const sessions = await api.request('/Chats/');
        state.sessions = sessions.sort((a, b) => new Date(b.last_updated) - new Date(a.last_updated));
        render();
    } catch (error) { console.error('Error sending message:', error); }
}

        await api.request('/UserFeedback/', { method: 'POST', body: JSON.stringify({ feedback, rating: parseInt(rating) }) });
        document.getElementById('feedback-success').textContent = 'Thank you for your feedback!';
        document.getElementById('feedback-success').classList.remove('hidden');
        document.getElementById('feedback-text').value = '';
        setTimeout(() => { document.getElementById('feedback-success').classList.add('hidden'); }, 3000);
    } catch (error) { console.error('Feedback error:', error); }
}

async function handleHumanHelp() {
    if (!confirm('Request human therapist assistance? Your information will be shared with our support team.')) return;
    try {
        const userData = await api.request('/UserDrillDown/');
        const userName = userData[0]?.content[0]?.name || 'Anonymous';
        await api.request('/TherapistNeeded/', { method: 'POST', body: JSON.stringify({ users_in_need: [userName] }) });
        alert('Your request has been submitted. A human therapist will contact you soon.');
    } catch (error) { alert('Failed to submit request. Please try again.'); }
}

function handleLogout() {
    api.clearTokens();
    // Destroy all charts on logout
    Object.keys(chartRegistry).forEach(destroyChart);
    state = {
        isAuthenticated: false, currentView: 'login', showConsent: false,
        sessions: [], activeSessionId: null, messages: [], drillDownList: [],
        hasTeam: false, dashboardData: null, teamData: null, subordinateData: null,
        currentSubordinateInfo: null, sidebarCollapsed: true, newChatModalOpen: false,
        psychoData: null, historyData: null, psychoTab: 'current', psychoLoading: false,
    };
    render();
}

async function navigateTo(view) {
    state.currentView = view;
    if (view === 'teamDashboard' && state.drillDownList.length > 0) {
        const userId = state.drillDownList[0].node_id;
        try {
            state.teamData = await api.request(`/DashBoardData/${userId}/health_dashboard/`);
        } catch (error) { state.teamData = null; }
    }
    if (view === 'psychoReport') {
        // Refresh psycho data when navigating to tab
        state.psychoLoading = true;
        render();
        await fetchPsychoData();
        state.psychoLoading = false;
    }
    render();
}

async function viewSubordinateData(nodeId) {
    try {
        state.currentSubordinateInfo = state.drillDownList.find(m => m.node_id === nodeId);
        state.subordinateData = await api.request(`/DashBoardData/${nodeId}/health_dashboard/`);
        state.currentView = 'subordinateDashboard';
        render();
    } catch (error) {
        state.subordinateData = null;
        state.currentView = 'subordinateDashboard';
        render();
    }
}

function goToTeamDashboard() { navigateTo('teamDashboard'); }

function handleSessionClick(sessionId) {
    state.activeSessionId = sessionId;
    state.currentView = 'chat';
    loadChatHistory(sessionId);
}

async function handleDeleteChat(sessionId) {
    if (!confirm('Delete this chat session?')) return;
    
    // 1. Optimistic UI Update: Instantly remove the session from local state
    state.sessions = state.sessions.filter(session => session.id !== sessionId);
    
    // 2. If the user is currently viewing the chat they just deleted, clear it out
    if (state.activeSessionId === sessionId) { 
        state.activeSessionId = null; 
        state.messages = []; 
        // Optional: Redirect them back to the dashboard so they aren't staring at an empty chat screen
        state.currentView = 'dashboard'; 
    }
    
    // 3. Re-render the UI immediately so the sidebar updates
    render();

    try {
        // 4. Perform the actual API deletion in the background
        await api.request(`/Chats/${sessionId}/`, { method: 'DELETE' });
        
        // 5. Sync with the server to ensure data consistency
        const sessions = await api.request('/Chats/');
        state.sessions = sessions.sort((a, b) => new Date(b.last_updated) - new Date(a.last_updated));
        render();
    } catch (error) { 
        console.error('Delete error:', error); 
        // If the deletion fails, you could optionally alert the user or refetch the list here
    }
}

function toggleSidebar() { state.sidebarCollapsed = !state.sidebarCollapsed; render(); }
function openNewChatModal() { state.newChatModalOpen = true; render(); }
function closeNewChatModal() { state.newChatModalOpen = false; render(); }

async function handleCreateNewChat(event) {
    event.preventDefault();
    const title = document.getElementById('new-chat-title').value;
    const mode = document.getElementById('new-chat-mode').value;
    try {
        const newSession = await api.request('/Chats/', { method: 'POST', body: JSON.stringify({ title, AiMode: mode }) });
        const sessions = await api.request('/Chats/');
        state.sessions = sessions.sort((a, b) => new Date(b.last_updated) - new Date(a.last_updated));
        state.activeSessionId = newSession.id;
        state.messages = [];
        state.currentView = 'chat';
        state.newChatModalOpen = false;
        render();
    } catch (error) { console.error('Create chat error:', error); }
}

// ─── Render ───────────────────────────────────────────────────────────────
function render() {
    const root = document.getElementById('root');
    if (state.showConsent) { root.innerHTML = ConsentModal({ onConsent: handleConsent }); return; }

    if (!state.isAuthenticated) {
        root.innerHTML = state.currentView === 'register' ? Register() : Login({ onLogin: handleLogin });
        setTimeout(() => { initializeGoogleSignIn(); renderGoogleButton(); }, 100);
        return;
    }

    let mainContent = '';
    switch (state.currentView) {
        case 'dashboard':
            mainContent = Dashboard({ dashboardData: state.dashboardData }); break;
        case 'teamDashboard':
            mainContent = TeamDashboard({ teamData: state.teamData, drillDownList: state.drillDownList }); break;
        case 'subordinateDashboard':
            mainContent = SubordinateDashboard({ subordinateData: state.subordinateData, memberInfo: state.currentSubordinateInfo }); break;
        case 'chat':
            mainContent = ChatInterface({ messages: state.messages, activeSessionId: state.activeSessionId }); break;
        case 'feedback':
            mainContent = FeedbackForm(); break;
        case 'psychoReport':
            if (state.psychoLoading) {
                mainContent = `
                    <div class="flex items-center justify-center h-64">
                        <div class="text-center">
                            <div class="w-12 h-12 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                            <p class="text-slate-400">Loading assessment data...</p>
                        </div>
                    </div>
                `;
            } else {
                mainContent = PsychoReport({ psychoData: state.psychoData, historyData: state.historyData, activeTab: state.psychoTab });
            }
            break;
        default:
            mainContent = Dashboard({ dashboardData: state.dashboardData });
    }

    root.innerHTML = `
        <div class="flex h-screen bg-[#0f172a] text-slate-200 font-sans overflow-hidden selection:bg-indigo-500/30">
            <aside class="${state.sidebarCollapsed ? 'w-24' : 'w-72'} glass-card border-y-0 border-l-0 border-r border-slate-700/30 flex flex-col p-5 transition-all duration-300 z-50">
                <div class="flex items-center justify-between mb-10">
                    ${!state.sidebarCollapsed ? `
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 rounded-lg bg-indigo-500 flex items-center justify-center shadow-lg shadow-indigo-500/30">${Icon({ name: 'brain', size: 18, className: 'text-white' })}</div>
                            <h1 class="text-lg font-bold text-white tracking-tight">Mind.exe</h1>
                        </div>
                    ` : `<div class="w-10 h-10 rounded-xl bg-indigo-500 flex items-center justify-center shadow-lg mx-auto">${Icon({ name: 'brain', size: 20, className: 'text-white' })}</div>`}
                    ${!state.sidebarCollapsed ? `<button onclick="toggleSidebar()" class="p-2 hover:bg-slate-700/50 rounded-lg transition-colors text-slate-400 hover:text-white">${Icon({ name: 'menu', size: 20 })}</button>` : ''}
                </div>

                ${state.sidebarCollapsed ? `<button onclick="toggleSidebar()" class="mb-8 w-full p-3 hover:bg-slate-700/50 rounded-xl transition-colors text-slate-400 hover:text-white flex justify-center">${Icon({ name: 'menu', size: 20 })}</button>` : ''}

                <div class="space-y-2">
                    <button onclick="navigateTo('dashboard')" class="w-full py-3 rounded-xl flex items-center px-4 ${state.currentView === 'dashboard' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/20' : 'text-slate-400 hover:bg-slate-800/60 hover:text-white'} transition-all group">
                        ${Icon({ name: 'dashboard', size: 20, className: state.currentView === 'dashboard' ? 'text-white' : 'group-hover:scale-110 transition-transform' })}
                        ${!state.sidebarCollapsed ? '<span class="ml-4 text-sm font-semibold tracking-wide">Dashboard</span>' : ''}
                    </button>

                    ${state.hasTeam ? `
                        <button onclick="navigateTo('teamDashboard')" class="w-full py-3 rounded-xl flex items-center px-4 ${state.currentView === 'teamDashboard' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/20' : 'text-slate-400 hover:bg-slate-800/60 hover:text-white'} transition-all group">
                            ${Icon({ name: 'users', size: 20 })}
                            ${!state.sidebarCollapsed ? '<span class="ml-4 text-sm font-semibold tracking-wide">Team View</span>' : ''}
                        </button>
                    ` : ''}

                    <button onclick="navigateTo('psychoReport')" class="w-full py-3 rounded-xl flex items-center px-4 ${state.currentView === 'psychoReport' ? 'bg-violet-600 text-white shadow-lg shadow-violet-600/20' : 'text-slate-400 hover:bg-slate-800/60 hover:text-white'} transition-all group">
                        ${Icon({ name: 'clipboardList', size: 20, className: state.currentView === 'psychoReport' ? 'text-white' : 'group-hover:scale-110 transition-transform' })}
                        ${!state.sidebarCollapsed ? '<span class="ml-4 text-sm font-semibold tracking-wide">Assessment</span>' : ''}
                    </button>

                    <button onclick="openNewChatModal()" class="w-full py-3 rounded-xl flex items-center px-4 ${state.currentView === 'chat' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/20' : 'text-slate-400 hover:bg-slate-800/60 hover:text-white'} transition-all group">
                        ${Icon({ name: 'messageSquare', size: 20 })}
                        ${!state.sidebarCollapsed ? '<span class="ml-4 text-sm font-semibold tracking-wide">New Chat</span>' : ''}
                    </button>

                    <button onclick="navigateTo('feedback')" class="w-full py-3 rounded-xl flex items-center px-4 ${state.currentView === 'feedback' ? 'bg-indigo-600 text-white shadow-lg shadow-indigo-600/20' : 'text-slate-400 hover:bg-slate-800/60 hover:text-white'} transition-all group">
                        ${Icon({ name: 'thumbsUp', size: 20 })}
                        ${!state.sidebarCollapsed ? '<span class="ml-4 text-sm font-semibold tracking-wide">Feedback</span>' : ''}
                    </button>
                </div>

                ${!state.sidebarCollapsed ? `
                    <div class="mt-8 flex-1 overflow-y-auto pr-2">
                        <h3 class="px-2 text-xs font-bold text-slate-500 uppercase tracking-wider mb-4">Recent Sessions</h3>
                        <div class="space-y-1">
                            ${state.sessions.map(session => {
                                const date = new Date(session.last_updated);
                                const dateStr = date.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
                                return `
                                <div class="group relative flex items-center">
                                    <button onclick="handleSessionClick('${session.id}')" class="flex-1 rounded-xl px-4 py-3 ${state.activeSessionId === session.id ? 'bg-slate-800/80 text-white border border-slate-700' : 'text-slate-400 hover:bg-slate-800/50 hover:text-slate-200'} transition-all text-left w-full overflow-hidden">
                                        <div class="flex items-center gap-3">
                                            <div class="min-w-[4px] h-4 rounded-full ${state.activeSessionId === session.id ? 'bg-indigo-500' : 'bg-slate-600'}"></div>
                                            <span class="text-sm truncate font-medium">${session.title}</span>
                                        </div>
                                        <div class="ml-4 mt-1 text-[10px] text-slate-600 font-mono pl-1">${dateStr}</div>
                                    </button>
                                    <button onclick="handleDeleteChat('${session.id}')" class="absolute right-2 p-2 text-slate-600 hover:text-red-400 rounded-lg hover:bg-red-500/10 transition-colors opacity-0 group-hover:opacity-100">
                                        ${Icon({ name: 'trash', size: 14 })}
                                    </button>
                                </div>
                            `}).join('')}
                            ${state.sessions.length === 0 ? '<div class="px-4 py-8 border border-dashed border-slate-800 rounded-xl text-center"><p class="text-xs text-slate-500">No active sessions</p></div>' : ''}
                        </div>
                    </div>
                ` : ''}

                <div class="mt-auto border-t border-slate-700/30 pt-6 space-y-3">
                    <button onclick="handleHumanHelp()" class="w-full py-3 rounded-xl flex items-center px-4 text-slate-400 hover:bg-rose-500/10 hover:text-rose-400 transition-colors group border border-transparent hover:border-rose-500/20">
                        ${Icon({ name: 'heartHandshake', size: 20 })}
                        ${!state.sidebarCollapsed ? '<span class="ml-4 text-sm font-semibold tracking-wide">Human Help</span>' : ''}
                    </button>
                    <button onclick="handleLogout()" class="w-full py-3 rounded-xl flex items-center px-4 text-slate-400 hover:bg-slate-800/80 hover:text-white transition-colors group">
                        ${Icon({ name: 'logOut', size: 20 })}
                        ${!state.sidebarCollapsed ? '<span class="ml-4 text-sm font-semibold tracking-wide">Logout</span>' : ''}
                    </button>
                </div>
            </aside>

            <main class="flex-1 overflow-y-auto relative bg-[#0f172a]">
                <div class="absolute top-0 left-0 w-full h-[500px] bg-indigo-900/10 blur-[120px] pointer-events-none"></div>
                <div class="relative z-10 p-8 min-h-full">
                    ${mainContent}
                </div>
            </main>
        </div>

        ${state.newChatModalOpen ? `
            <div class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center z-[100] animate-fade-in">
                <div class="glass-card bg-[#1e293b] rounded-3xl p-8 w-full max-w-md border border-slate-700/50 shadow-2xl relative">
                    <button onclick="closeNewChatModal()" class="absolute top-6 right-6 text-slate-400 hover:text-white">${Icon({ name: 'x', size: 24 })}</button>
                    <div class="mb-8">
                        <div class="w-14 h-14 bg-indigo-500/20 rounded-2xl flex items-center justify-center mb-4 text-indigo-400">${Icon({ name: 'messageSquare', size: 28 })}</div>
                        <h2 class="text-2xl font-bold text-white">Start New Session</h2>
                        <p class="text-slate-400 text-sm mt-1">Choose your preferred AI companion mode.</p>
                    </div>
                    <form onsubmit="handleCreateNewChat(event)" class="space-y-6">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Session Name</label>
                            <input type="text" id="new-chat-title" required class="glass-input w-full px-5 py-4 rounded-xl text-white placeholder-slate-500" placeholder="e.g., Weekly Check-in..." />
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Select Mode</label>
                            <div class="grid grid-cols-2 gap-3">
                                <label class="cursor-pointer">
                                    <input type="radio" name="chat-mode" value="therapy" class="peer hidden" checked onchange="document.getElementById('new-chat-mode').value = this.value">
                                    <div class="p-4 rounded-xl border border-slate-700 bg-slate-800/50 peer-checked:bg-indigo-600 peer-checked:border-indigo-500 peer-checked:text-white text-slate-400 transition-all text-center">
                                        <div class="font-bold text-sm mb-1">Therapy AI</div>
                                        <div class="text-[10px] opacity-70">Clinical Approach</div>
                                    </div>
                                </label>
                                <label class="cursor-pointer">
                                    <input type="radio" name="chat-mode" value="counsellor" class="peer hidden" onchange="document.getElementById('new-chat-mode').value = this.value">
                                    <div class="p-4 rounded-xl border border-slate-700 bg-slate-800/50 peer-checked:bg-purple-600 peer-checked:border-purple-500 peer-checked:text-white text-slate-400 transition-all text-center">
                                        <div class="font-bold text-sm mb-1">Counsellor AI</div>
                                        <div class="text-[10px] opacity-70">Guidance & Support</div>
                                    </div>
                                </label>
                            </div>
                            <select id="new-chat-mode" class="hidden">
                                <option value="therapy">Therapy AI</option>
                                <option value="counsellor">Counsellor AI</option>
                            </select>
                        </div>
                        <div class="flex gap-3 pt-2">
                            <button type="button" onclick="closeNewChatModal()" class="flex-1 py-4 rounded-xl border border-slate-600 text-slate-300 hover:bg-slate-800 transition-colors font-medium">Cancel</button>
                            <button type="submit" class="btn-premium flex-1 py-4 rounded-xl text-white font-bold">Start Chat</button>
                        </div>
                    </form>
                </div>
            </div>
        ` : ''}
    `;
}

window.addEventListener('DOMContentLoaded', async () => {
    if (localStorage.getItem('access_token')) {
        state.isAuthenticated = true;
        try {
            const needsConsent = await api.checkServerConsent();
            if (needsConsent) { state.showConsent = true; render(); }
            else { await initializeApp(); }
        } catch (e) { handleLogout(); }
    } else { render(); }
});
    </script>
</body>
