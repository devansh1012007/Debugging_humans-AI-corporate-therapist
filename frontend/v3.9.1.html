const CURRENT_CONSENT_VERSION = 'v1.0-2026';
const GOOGLE_CLIENT_ID = '420454232320-8mse8aona778k5jktdcs847c98bfsabu.apps.googleusercontent.com';

class ApiClient {
    constructor() {
        if (typeof window !== 'undefined') {
            this.accessToken = localStorage.getItem('access_token');
            this.refreshToken = localStorage.getItem('refresh_token');
        } else {
            this.accessToken = null;
            this.refreshToken = null;
        }
    }
    setTokens(access, refresh) {
        this.accessToken = access;
        this.refreshToken = refresh;
        localStorage.setItem('access_token', access);
        localStorage.setItem('refresh_token', refresh);
    }
    clearTokens() {
        this.accessToken = null;
        this.refreshToken = null;
        localStorage.removeItem('access_token');
        localStorage.removeItem('refresh_token');
    }
    async request(endpoint, options = {}) {
        let url = endpoint.startsWith('http') ? endpoint : `${API_BASE}${endpoint}`;
        const headers = { 'Content-Type': 'application/json', ...options.headers };
        if (this.accessToken) headers['Authorization'] = `Bearer ${this.accessToken}`;
        const config = { 
            ...options, 
            headers,
            credentials: 'include' 
        };
        
        console.log(`🌐 API Request: ${options.method || 'GET'} ${url}`);
        try {
            let response = await fetch(url, config);
            console.log(`📡 Response status: ${response.status}`);
            
            if (response.status === 401 && this.refreshToken) {
                console.log('🔄 Token expired, refreshing...');
                const refreshSuccess = await this.refreshAccessToken();
                if (refreshSuccess) {
                    config.headers['Authorization'] = `Bearer ${this.accessToken}`;
                    response = await fetch(url, config);
                    console.log(`📡 Retry response status: ${response.status}`);
                } else {
                    console.error('❌ Token refresh failed');
                    this.clearTokens();
                    window.location.reload(); 
                    throw new Error('Session expired');
                }
            }
            if (!response.ok) {
                const errorData = await response.json().catch(() => ({}));
                console.error('❌ API Error:', errorData);
                throw new Error(errorData.detail || errorData.error || `Error: ${response.status}`);
            }
            const data = await response.json();
            console.log('✅ Response data:', data);
            return data;
        } catch (error) { 
            console.error('❌ Request failed:', error);
            throw error; 
        }
    }
    async refreshAccessToken() {
        try {
            const response = await fetch(`${API_BASE}/refresh/`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ refresh: this.refreshToken }),
                credentials: 'include'
            });
            if (response.ok) {
                const data = await response.json();
                this.setTokens(data.access, this.refreshToken); 
                return true;
            }
            return false;
        } catch (e) { return false; }
    }
    async checkServerConsent() {
        try {
            const response = await this.request('UserConsent/needs_new_consent/', {
                method: 'POST',
                body: JSON.stringify({}) 
            });
            
            if (response && typeof response.needs_consent !== 'undefined') {
                return response.needs_consent;
            }
            return true;
        } catch (error) {
            console.error("Failed to check consent status:", error);
            return true;
        }
    }
}

function initializeGoogleSignIn() {
    if (typeof google !== 'undefined' && google.accounts) {
        google.accounts.id.initialize({
            client_id: GOOGLE_CLIENT_ID,
            callback: handleGoogleCallback,
            auto_select: false,
            cancel_on_tap_outside: true
        });
    }
}

function renderGoogleButton() {
    if (typeof google !== 'undefined' && google.accounts) {
        const buttonDiv = document.getElementById('google-signin-button');
        if (buttonDiv) {
            google.accounts.id.renderButton(
                buttonDiv,
                {
                    theme: 'outline',
                    size: 'large',
                    width: buttonDiv.offsetWidth,
                    text: 'signin_with',
                    shape: 'pill'
                }
            );
        }
    }
}

async function handleGoogleCallback(response) {
    console.log('🔐 Google Sign-In callback received');
    try {
        const data = await api.request('/auth/google/', {
            method: 'POST',
            body: JSON.stringify({ id_token: response.credential })
        });
        if (data.access && data.refresh) {
            api.setTokens(data.access, data.refresh);
            state.isAuthenticated = true;
            const needsConsent = await api.checkServerConsent();
            if (needsConsent) {
                state.showConsent = true;
                render();
            } else {
                await initializeApp();
            }
        } else { throw new Error('Invalid response from server'); }
    } catch (error) {
        console.error('❌ Google login error:', error);
        alert('Google Sign-In failed. Please try again.');
    }
}

async function handleLogin(event) {
    event.preventDefault();
    const username = document.getElementById('username').value;
    const password = document.getElementById('password').value;
    const errorDiv = document.getElementById('login-error');
    
    console.log('🔐 Attempting login...');
    
    try {
        const data = await api.request('/login/', {
            method: 'POST',
            body: JSON.stringify({ username, password })
        });
        
        if (data.access && data.refresh) {
            api.setTokens(data.access, data.refresh);
            state.isAuthenticated = true;
            
            const needsConsent = await api.checkServerConsent();
            if (needsConsent) {

        }
    } catch (error) {
        console.error('❌ Login error:', error);
        errorDiv.textContent = 'Invalid credentials or server error';
        errorDiv.classList.remove('hidden');
    }
}

async function initializeApp() {
    console.log('🚀 Starting app initialization...');
    try {
        const drillDownData = await api.request('/UserDrillDown/');
        if (drillDownData && drillDownData.length > 0) {
            state.drillDownList = drillDownData[0].content || [];
            state.hasTeam = state.drillDownList.length > 0 && state.drillDownList[0].has_team;
        }
        
        const sessions = await api.request('/Chats/');
        if (Array.isArray(sessions)) {
            state.sessions = sessions.sort((a, b) => new Date(b.last_updated) - new Date(a.last_updated));
        } else {
            state.sessions = [];
        }
        
        const dashboardArr = await api.request('/UserDashboard/');
        if (dashboardArr && dashboardArr.length > 0) {
            state.dashboardData = dashboardArr[0];
        }

        // Fetch new psycho data
        try {
            const pData = await api.request('/UserPsycoProcessedData/');
            state.psychoData = Array.isArray(pData) ? pData[0] : pData;
        } catch(e) { console.error('Error fetching psycho data', e); }

        try {
            const pHistory = await api.request('/UserPsycoProcessedDataHistory/');
            state.psychoHistory = Array.isArray(pHistory) ? pHistory[0] : pHistory;
        } catch(e) { console.error('Error fetching history data', e); }

        state.currentView = 'dashboard';
        render();
    } catch (error) {
        console.error('❌ Initialization error:', error);
        state.currentView = 'dashboard';
        render();
    }
}

async function loadChatHistory(sessionId) {
    try {
        const chatData = await api.request(`/ChatData/?chat_id=${sessionId}`);
        if (Array.isArray(chatData) && chatData.length > 0) {
            const rawHistory = chatData[0].content || [];

                role: msg.role,

            }));

        render();
    } catch (error) {
        console.error('Error loading chat:', error);
        state.messages = [];
        render();
    }
}

async function handleSendMessage(event) {
    event.preventDefault();
    const input = document.getElementById('chat-input');
    const message = input.value.trim();
    
    if (!message) return;
    if (!state.activeSessionId) {
        try {
            const newSession = await api.request('/Chats/', {
                method: 'POST',
                body: JSON.stringify({
                    title: message.substring(0, 30) + '...',
                    AiMode: 'therapy'
                })
            });
            state.activeSessionId = newSession.id;
            
            const sessions = await api.request('/Chats/');
            state.sessions = sessions.sort((a, b) => new Date(b.last_updated) - new Date(a.last_updated));
        } catch (error) {
            console.error('Error creating session:', error);
            return;
        }
    }
    state.messages.push({ role: 'user', content: message });
    input.value = '';
    render();
    try {
        const response = await fetch(`${API_BASE}/ChatData/continue_chat/`, {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Authorization': `Bearer ${api.accessToken}`
            },
            body: JSON.stringify({
                prompt: message,
                mode: 'therapy',
                ChatID: state.activeSessionId
            })
        });
        if (!response.ok) {
            throw new Error(`Server Error: ${response.statusText}`);
        }
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let aiResponse = '';
        
        const streamingDiv = document.getElementById('streaming-message');
        streamingDiv.innerHTML = `
            <div class="flex justify-start animate-fade-in">
                <div class="bg-white border border-slate-100 text-slate-700 rounded-2xl rounded-bl-sm px-6 py-4 max-w-[85%] text-[15px] shadow-sm leading-relaxed">
                    <p class="whitespace-pre-wrap inline" id="ai-response"></p>
                    <span class="inline-block w-1.5 h-4 ml-1 align-middle bg-brand-400 animate-pulse-soft rounded-sm"></span>
                </div>
            </div>
        `;
        
        while (true) {
            const { done, value } = await reader.read();
            if (done) break;
            
            const chunk = decoder.decode(value);
            aiResponse += chunk;
            document.getElementById('ai-response').textContent = aiResponse;
            
            const chatMessages = document.getElementById('chat-messages');
            if(chatMessages) chatMessages.scrollTop = chatMessages.scrollHeight;
        }
        state.messages.push({ role: 'assistant', content: aiResponse });
        
        const sessions = await api.request('/Chats/');
        state.sessions = sessions.sort((a, b) => new Date(b.last_updated) - new Date(a.last_updated));
        
        render();
    } catch (error) {
        console.error('Error sending message:', error);
    }
}

// Logic for rendering Chart.js on the Psycho Report tab
function initPsychoCharts() {
    if (state.currentView !== 'psychoReport') return;
    // Handle the double-nested content structure for the charts
    const historyData = state.psychoHistory?.content?.content || state.psychoHistory?.content || [];
    if (!Array.isArray(historyData) || historyData.length === 0) return;

    // Sort by date just in case
    const sorted = [...historyData].sort((a, b) => new Date(a.date) - new Date(b.date));
    const labels = sorted.map(item => item.date);

    // Chart 1: Clinical (Depression & Anxiety)
    const depData = sorted.map(item => item.content?.depression?.total_score || 0);
    const anxData = sorted.map(item => item.content?.anxiety?.total_score || 0);

    const ctxClinical = document.getElementById('chart-clinical');
    if (ctxClinical) {
        new Chart(ctxClinical, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    {
                        label: 'Depression',
                        data: depData,
                        borderColor: '#e11d48', // rose-600
                        backgroundColor: 'rgba(225, 29, 72, 0.1)',
                        tension: 0.4,
                        fill: true
                    },
                    {
                        label: 'Anxiety',
                        data: anxData,
                        borderColor: '#ea580c', // orange-600
                        backgroundColor: 'rgba(234, 88, 12, 0.1)',
                        tension: 0.4,
                        fill: true
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { position: 'bottom', labels: { font: { family: 'Inter' } } } },
                scales: {
                    y: { beginAtZero: true, grid: { color: '#f1f5f9' } },
                    x: { grid: { display: false } }
                }
            }
        });
    }

    // Chart 2: Big Five Traits
    const neurData = sorted.map(item => item.content?.big_five?.Neuroticism?.raw_score || 0);
    const extData = sorted.map(item => item.content?.big_five?.Extraversion?.raw_score || 0);
    const openData = sorted.map(item => item.content?.big_five?.["Openness to Experience"]?.raw_score || 0);
    const agreeData = sorted.map(item => item.content?.big_five?.Agreeableness?.raw_score || 0);
    const consData = sorted.map(item => item.content?.big_five?.Conscientiousness?.raw_score || 0);

    const ctxBigFive = document.getElementById('chart-bigfive');
    if (ctxBigFive) {
        new Chart(ctxBigFive, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [
                    { label: 'Neuroticism', data: neurData, borderColor: '#8b5cf6', tension: 0.3 }, // violet
                    { label: 'Extraversion', data: extData, borderColor: '#0ea5e9', tension: 0.3 }, // sky
                    { label: 'Openness', data: openData, borderColor: '#10b981', tension: 0.3 }, // emerald
                    { label: 'Agreeableness', data: agreeData, borderColor: '#f59e0b', tension: 0.3 }, // amber
                    { label: 'Conscientiousness', data: consData, borderColor: '#64748b', tension: 0.3 } // slate
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { position: 'bottom', labels: { boxWidth: 12, font: { size: 10, family: 'Inter' } } } },
                scales: {
                    y: { max: 5, min: 0, grid: { color: '#f1f5f9' } },
                    x: { grid: { display: false } }
                }
            }
        });
    }
}

                        ${Icon({ name: 'logOut', size: 20, className: 'group-hover:scale-110 transition-transform' })}
                        ${!state.sidebarCollapsed ? '<span class="ml-4 text-sm font-semibold tracking-wide">Logout</span>' : ''}
                    </button>
                </div>
            </aside>
            <main class="flex-1 overflow-y-auto relative">
                <div class="relative z-10 p-10 min-h-full">
                    ${mainContent}
                </div>
            </main>
        </div>

        ${state.newChatModalOpen ? `
            <div class="fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-[100] animate-fade-in p-4">
                <div class="wellness-card p-8 w-full max-w-md relative">
                    <button onclick="closeNewChatModal()" class="absolute top-6 right-6 text-slate-400 hover:text-slate-600 transition-colors">
                        ${Icon({ name: 'x', size: 24 })}
                    </button>
                    
                    <div class="mb-8">
                        <div class="w-14 h-14 bg-brand-50 rounded-2xl flex items-center justify-center mb-4 text-brand-600">
                             ${Icon({ name: 'messageSquare', size: 28 })}
                        </div>
                        <h2 class="text-2xl font-heading font-bold text-slate-800">Start New Session</h2>
                        <p class="text-slate-500 text-sm mt-1">Choose your preferred AI companion mode.</p>
                    </div>
                    <form onsubmit="handleCreateNewChat(event)" class="space-y-6">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Session Name</label>
                            <input type="text" id="new-chat-title" required class="wellness-input w-full px-5 py-4 rounded-xl placeholder-slate-400" placeholder="e.g., Weekly Check-in..." />
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-widest mb-2">Select Mode</label>
                            <div class="grid grid-cols-2 gap-3">
                                <label class="cursor-pointer">
                                    <input type="radio" name="chat-mode" value="therapy" class="peer hidden" checked onchange="document.getElementById('new-chat-mode').value = this.value">
                                    <div class="p-4 rounded-xl border border-slate-200 bg-slate-50 peer-checked:bg-brand-600 peer-checked:border-brand-500 peer-checked:text-white text-slate-500 transition-all text-center h-full">
                                        <div class="font-bold text-sm mb-1">Therapy AI</div>
                                        <div class="text-[10px] opacity-80">Clinical Approach</div>
                                    </div>
                                </label>
                                <label class="cursor-pointer">
                                    <input type="radio" name="chat-mode" value="counsellor" class="peer hidden" onchange="document.getElementById('new-chat-mode').value = this.value">
                                    <div class="p-4 rounded-xl border border-slate-200 bg-slate-50 peer-checked:bg-indigo-600 peer-checked:border-indigo-500 peer-checked:text-white text-slate-500 transition-all text-center h-full">
                                        <div class="font-bold text-sm mb-1">Counsellor AI</div>
                                        <div class="text-[10px] opacity-80">Guidance & Support</div>
                                    </div>
                                </label>
                            </div>
                            <select id="new-chat-mode" class="hidden">
                                <option value="therapy">Therapy AI</option>
                                <option value="counsellor">Counsellor AI</option>
                            </select>
                        </div>
                        <div class="flex gap-3 pt-2">
                            <button type="button" onclick="closeNewChatModal()" class="flex-1 py-4 rounded-xl border border-slate-200 text-slate-600 hover:bg-slate-50 transition-colors font-semibold">Cancel</button>
                            <button type="submit" class="btn-premium flex-1 py-4 rounded-xl font-bold">Start Chat</button>
                        </div>
                    </form>
                </div>
            </div>
        ` : ''}
    `;

    // Initialize Chart.js safely if we are on the Psycho Report view
    if (state.currentView === 'psychoReport') {
        setTimeout(initPsychoCharts, 50);
    }
}

window.addEventListener('DOMContentLoaded', async () => {
    console.log('🌐 DOM Content Loaded');
    if (localStorage.getItem('access_token')) {
        state.isAuthenticated = true;
        try {
            const needsConsent = await api.checkServerConsent();
            if (needsConsent) {
                state.showConsent = true;
                render();
            } else {
                await initializeApp();
            }
        } catch (e) {
            handleLogout();
        }
    } else {
        render();
    }
});
    </script>
</body>
</html>
